; php-fpm only (the CLI keeps its own defaults for artisan, queue workers and
; Reverb). Loaded after 99-mbfd-production.ini, which sets the shared upload
; limits, variables_order and OPcache sizes.
[PHP]
; The built-in server ran with the CLI's unlimited memory and time. Keep
; generous ceilings, but never unbounded in a pool of long-lived children.
memory_limit = 1024M
; CPU seconds (Linux), not wall clock; php-fpm.conf request_terminate_timeout
; is the wall-clock ceiling.
max_execution_time = 300
; nginx hands PHP a fully buffered body, so parsing it is fast.
max_input_time = 120
; Same as the CLI runtime it replaces: streamed responses (support chat SSE,
; exports) flush immediately; nginx does the response buffering.
output_buffering = 0
expose_php = Off
display_errors = Off
log_errors = On
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
; The image is immutable: PHP files never change under a running pool. Every
; writer of compiled PHP at runtime (deploy's optimize:clear/config:cache/
; route:cache/view:cache/event:cache) is followed by a graceful php-fpm reload
; (supervisorctl signal USR2 php-fpm), which starts a fresh OPcache.
opcache.validate_timestamps = 0
opcache.save_comments = 1
