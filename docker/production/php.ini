[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS

; The image ships ~50k PHP files (Filament, Livewire and compiled views); the
; 128 MB / 10k-file OPcache defaults can evict hot scripts. Timestamps stay
; validated because deploy rewrites bootstrap/cache in the running container.
[opcache]
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
