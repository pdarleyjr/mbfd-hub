[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS

; The image ships ~50k PHP files (Filament, Livewire and compiled views); the
; 128 MB / 10k-file OPcache defaults can evict hot scripts. Loaded by both the
; CLI and php-fpm; php-fpm.ini turns timestamp validation off for the web pool
; only, and deploy reloads php-fpm after it rewrites bootstrap/cache.
[opcache]
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
