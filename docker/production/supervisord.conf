[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Web tier: nginx (port 8081) buffers whole requests and responses and passes
; PHP to the php-fpm pool over a private socket (docker/production/nginx.conf,
; php-fpm.conf). Both stop gracefully on SIGQUIT, finishing in-flight requests.
; Graceful php-fpm reload (also clears OPcache):
;   supervisorctl -c /etc/supervisor/conf.d/supervisord.conf signal USR2 php-fpm
[program:php-fpm]
command=/usr/sbin/php-fpm8.5 --nodaemonize --fpm-config /etc/php/8.5/fpm/php-fpm-hub.conf
priority=10
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -e stderr -c /etc/nginx/hub/nginx.conf
priority=20
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --queue=operational-forms,notifications,default
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=60

[program:reverb]
process_name=%(program_name)s
command=/usr/bin/php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=30

[program:scheduler]
process_name=%(program_name)s
command=/bin/sh -c "while true; do /usr/bin/php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:policy-library-worker]
command=/usr/bin/php /var/www/html/artisan queue:work policy-library --queue=policy-library --sleep=3 --tries=1 --timeout=1800 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=1815
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:ai-automation-worker]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=ai-automation,ai-backlog --sleep=3 --tries=1 --timeout=80 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
