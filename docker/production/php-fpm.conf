; MBFD Hub production php-fpm (started by Supervisor as the non-root sail user,
; so no user/group directives: the pool runs as whoever starts the master).
;
; Sizing for gmktec (32 cores, 61 GB RAM, shared with other services): a Hub
; web worker is ~130 MB resident, so 32 children stay under ~4.5 GB and well
; inside PostgreSQL's 100 connections next to the queue workers. Override with
; PHP_FPM_MAX_CHILDREN in the container environment, no rebuild needed.

[global]
pid = /var/lib/hub-web/run/php-fpm.pid
error_log = /proc/self/fd/2
log_level = notice
log_limit = 8192
daemonize = no
; SIGQUIT (stop) and SIGUSR2 (graceful reload, which also clears OPcache) let
; in-flight requests finish for up to this long.
process_control_timeout = 60s

[hub]
listen = /var/lib/hub-web/run/php-fpm.sock
listen.mode = 0600
listen.backlog = 511

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
; Recycle a child after this many requests to cap slow memory growth.
pm.max_requests = 1000

pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Wall-clock ceiling per request. Cloudflare already cuts responses at 100 s;
; nginx waits slightly longer (fastcgi_read_timeout 310s) so PHP ends first.
request_terminate_timeout = 300s

; Workers inherit the container environment exactly like `artisan serve` did
; (APP_*, POLICY_LIBRARY_PYTHON_BINARY, the CI runtime probe's --env values).
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
