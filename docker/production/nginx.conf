# MBFD Hub production web server.
#
# nginx runs as the non-root `sail` user under Supervisor and hands PHP to the
# php-fpm pool over a private Unix socket. It replaces the PHP built-in server
# (`artisan serve`), which gave every request -- including a slow phone photo
# upload over LTE -- one of a handful of single-threaded workers for its whole
# duration. Here nginx receives the complete request body before PHP sees it and
# buffers the complete response before sending it, so a slow client never holds
# a PHP worker.
#
# Routing parity with server.php (still used by `artisan serve` in local and E2E
# runs): only real files below public/ bypass Laravel; directories and every
# other path reach index.php so route middleware (canonical authentication)
# always runs.

worker_processes 4;
pid /var/lib/hub-web/run/nginx.pid;
error_log stderr warn;
daemon off;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # cloudflared keeps origin connections open for up to 90 s; outlive it so a
    # reused connection is never closed underneath an in-flight request.
    keepalive_timeout 100s;
    keepalive_requests 1000;

    # The image runs without root, so every writable path is inside the
    # sail-owned runtime directory created by the Dockerfile.
    client_body_temp_path /var/lib/hub-web/tmp/client-body 1 2;
    proxy_temp_path /var/lib/hub-web/tmp/proxy;
    fastcgi_temp_path /var/lib/hub-web/tmp/fastcgi 1 2;
    uwsgi_temp_path /var/lib/hub-web/tmp/uwsgi;
    scgi_temp_path /var/lib/hub-web/tmp/scgi;

    # Uploads: matches PHP upload_max_filesize/post_max_size (100M). Bodies up to
    # 512k stay in memory; larger ones spool to disk until complete.
    client_max_body_size 100m;
    client_body_buffer_size 512k;
    client_body_timeout 120s;
    client_header_timeout 30s;
    large_client_header_buffers 4 32k;
    send_timeout 120s;

    # Cloudflare tunnel (cloudflared on the host) reaches the container from the
    # Docker bridge. nginx logs the member's address from CF-Connecting-IP, but
    # PHP still receives the original peer as REMOTE_ADDR (see the fastcgi block)
    # so Laravel's trusted-proxy rules for X-Forwarded-* keep working unchanged.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # One JSON line per request on stdout (Docker rotates container logs).
    # $uri becomes /index.php after try_files, so the original request path is
    # logged, with two cuts: the query string is dropped (signed-URL signatures,
    # ?token=...), and a secret carried in the path itself is replaced by
    # [redacted]: password reset links (/reset-password/{token}), city e-mail
    # verification links (/account/city-email/verify/{token}), supply room
    # screen pairing links (/supply-kiosk/pair/{token}), and any other path
    # segment of 40 or more token characters. The Referer header is never
    # logged. Container health probes are not logged.
    map $request_uri $hub_log_path {
        "~^(?<hub_path>[^?]*)" $hub_path;
        default "";
    }
    map $hub_log_path $hub_log_path_safe {
        "~*^/+reset-password/+[^/]+" "/reset-password/[redacted]";
        "~*^/+account/+city-email/+verify/+[^/]+" "/account/city-email/verify/[redacted]";
        "~*^/+supply-kiosk/+pair/+[^/]+" "/supply-kiosk/pair/[redacted]";
        "~^(?<hub_token_head>.*?/)[A-Za-z0-9_%=-]{40,}(?<hub_token_tail>/.*)?$" "${hub_token_head}[redacted]${hub_token_tail}";
        default $hub_log_path;
    }
    map "$realip_remote_addr $hub_log_path" $hub_loggable {
        "127.0.0.1 /up" 0;
        "127.0.0.1 /fpm-ping" 0;
        default 1;
    }
    log_format hub_json escape=json
        '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
        '"path":"$hub_log_path_safe","status":$status,"bytes":$body_bytes_sent,"request_bytes":$request_length,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status","host":"$host","cf_ray":"$http_cf_ray",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout hub_json if=$hub_loggable;

    server {
        listen 8081 default_server;
        server_name _;
        root /var/www/html/public;

        # Dotfiles (e.g. public/.htaccess) are never served; /.well-known/*
        # stays reachable for the OIDC discovery route.
        location ~ /\.(?!well-known/) {
            return 404;
        }

        # Content-hashed Vite output never changes under its name.
        location ~ "^/(?:build|daily)/assets/[A-Za-z0-9._-]+-[A-Za-z0-9_-]{8,}\.(?:css|js|mjs|woff2|mp3|png|svg|webp)$" {
            charset utf-8;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri /index.php?$query_string;
        }

        # Service workers are unhashed: always revalidate, so the edge never
        # keeps serving a retired worker after a release.
        location ~ "^/(?:sw\.js|daily/sw\.js|daily/service-worker\.js)$" {
            charset utf-8;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri /index.php?$query_string;
        }

        # A registration made from this URL has scope /admin/, which browsers
        # accept only when the script allows it (for every later update too).
        location = /admin-pwa/service-worker.js {
            charset utf-8;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Service-Worker-Allowed "/admin/" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri /index.php?$query_string;
        }

        # php-fpm liveness and pool status, for diagnostics from inside the
        # container only (docker exec ... curl http://127.0.0.1:8081/fpm-status).
        location ~ ^/(?:fpm-ping|fpm-status)$ {
            if ($realip_remote_addr != "127.0.0.1") {
                return 404;
            }
            access_log off;
            fastcgi_param SCRIPT_NAME $uri;
            fastcgi_param SCRIPT_FILENAME $uri;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_pass unix:/var/lib/hub-web/run/php-fpm.sock;
        }

        # Only index.php is ever executed. Any other *.php path is routed to
        # Laravel (which answers 404 for unknown routes) and is never served as
        # source.
        location ~ \.php$ {
            rewrite ^ /index.php last;
        }

        location / {
            charset utf-8;
            try_files $uri /index.php?$query_string;
        }

        location = /index.php {
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI /index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx;
            # Keep PHP's view of the peer identical to the old built-in server:
            # the Docker-bridge proxy address that Laravel's trustProxies() list
            # accepts, so X-Forwarded-Proto/Host/For resolve exactly as before.
            fastcgi_param REMOTE_ADDR $realip_remote_addr;
            fastcgi_param REMOTE_PORT $realip_remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $host;
            fastcgi_param REDIRECT_STATUS 200;
            # httpoxy: never let a client header become PHP's HTTP_PROXY.
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass unix:/var/lib/hub-web/run/php-fpm.sock;

            # Whole request body first (fastcgi_request_buffering), whole
            # response after: PHP is busy only while it actually runs.
            fastcgi_request_buffering on;
            fastcgi_buffering on;
            fastcgi_buffer_size 64k;
            fastcgi_buffers 32 32k;
            fastcgi_busy_buffers_size 128k;
            fastcgi_max_temp_file_size 1024m;
            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout 120s;
            # Above php-fpm's request_terminate_timeout so PHP, not nginx, ends
            # a runaway request.
            fastcgi_read_timeout 310s;
        }
    }
}
