config_version: 2
models:
- name: summarizer-model
  display_name: Llama 3.1 8B Summarizer (Fast Background Summarization)
  use: langchain_openai:ChatOpenAI
  model: meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo
  api_key: $DEEPINFRA_API_KEY
  base_url: https://api.deepinfra.com/v1/openai
  temperature: 0.1
  max_tokens: 2048
  supports_thinking: false
  supports_vision: false

- name: coordinator-model
  display_name: GLM-5 Lead Agent (Planning and Orchestration)
  use: langchain_openai:ChatOpenAI
  model: zai-org/GLM-5
  api_key: $DEEPINFRA_API_KEY
  base_url: https://api.deepinfra.com/v1/openai
  temperature: 0.2
  max_tokens: 8192
  supports_thinking: true
  supports_vision: false
  streaming: true

- name: analysis-model
  display_name: Llama-4-Maverick Analysis Agent (1024k Context)
  use: langchain_openai:ChatOpenAI
  model: meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8
  api_key: $DEEPINFRA_API_KEY
  base_url: https://api.deepinfra.com/v1/openai
  temperature: 0.1
  max_tokens: 16384
  supports_thinking: false
  supports_vision: true
  streaming: true

- name: coding-model
  display_name: Seed-2.0-mini Coding Agent (Low-Latency)
  use: langchain_openai:ChatOpenAI
  model: ByteDance/Seed-2.0-mini
  api_key: $DEEPINFRA_API_KEY
  base_url: https://api.deepinfra.com/v1/openai
  temperature: 0.1
  max_tokens: 16384
  supports_thinking: false
  supports_vision: false
  streaming: true

- name: debug-model
  display_name: Gemini 2.5 Pro Debug Agent (1M Context Forensic)
  use: langchain_google_genai:ChatGoogleGenerativeAI
  model: gemini-2.5-pro
  api_key: $GOOGLE_GEMINI_API_KEY
  temperature: 0.1
  max_tokens: 8192
  supports_thinking: true
  supports_vision: true
  streaming: true

- name: coder-model
  display_name: MiniMax-M2.5 Coder (React/Konva/API)
  use: langchain_openai:ChatOpenAI
  model: MiniMaxAI/MiniMax-M2.5
  api_key: $DEEPINFRA_API_KEY
  base_url: https://api.deepinfra.com/v1/openai
  temperature: 0.1
  max_tokens: 16384
  supports_thinking: false
  supports_vision: true

- name: vision-model
  display_name: Qwen2.5-VL-32B Vision (Image Pipeline and OCR)
  use: langchain_openai:ChatOpenAI
  model: Qwen/Qwen2.5-VL-32B-Instruct
  api_key: $DEEPINFRA_API_KEY
  base_url: https://api.deepinfra.com/v1/openai
  temperature: 0.0
  max_tokens: 4096
  supports_thinking: false
  supports_vision: true

tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash

tools:
- name: web_search
  group: web
  use: deerflow.community.duckduckgo.tools:web_search_tool
  max_results: 5
- name: web_fetch
  group: web
  use: deerflow.community.jina_ai.tools:web_fetch_tool
  timeout: 10
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: write_file
  group: file:write
  use: deerflow.sandbox.tools:write_file_tool
- name: str_replace
  group: file:write
  use: deerflow.sandbox.tools:str_replace_tool
- name: bash
  group: bash
  use: deerflow.sandbox.tools:bash_tool

tool_search:
  enabled: true

subagents:
  timeout_seconds: 900
  agents:
    general-purpose:
      timeout_seconds: 1800
    bash:
      timeout_seconds: 300

sandbox:
  use: deerflow.community.aio_sandbox:AioSandboxProvider
  mounts:
  - host_path: /home/devcontainers/src/mbfd-hub
    container_path: /mnt/user-data/workspace/mbfd-hub
    read_only: false
  - host_path: /home/devcontainers/src/deer-flow/docker/sandbox-ssh/id_ed25519
    container_path: /root/.ssh/id_ed25519
    read_only: false
  - host_path: /home/devcontainers/src/deer-flow/docker/sandbox-ssh/known_hosts
    container_path: /root/.ssh/known_hosts
    read_only: false
  - host_path: /home/devcontainers/src/deer-flow/docker/sandbox-ssh/config
    container_path: /root/.ssh/config
    read_only: false
  - host_path: /home/devcontainers/src/deer-flow/docker/sandbox-ssh/.gitconfig
    container_path: /root/.gitconfig
    read_only: false
  environment:
    GITHUB_TOKEN: $GITHUB_TOKEN
    DEEPINFRA_API_KEY: $DEEPINFRA_API_KEY
    GIT_AUTHOR_NAME: pdarleyjr
    GIT_AUTHOR_EMAIL: pdarleyjr@gmail.com
    GIT_COMMITTER_NAME: pdarleyjr
    GIT_COMMITTER_EMAIL: pdarleyjr@gmail.com

skills:
  container_path: /mnt/skills
  custom_path: skills/custom

title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null

summarization:
  enabled: false
  model_name: summarizer-model
  trigger:
  - type: tokens
    value: 50000
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 50000
  summary_prompt: null

memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000

checkpointer:
  type: sqlite
  connection_string: checkpoints.db

channels:
  langgraph_url: http://langgraph:2024
  gateway_url: http://gateway:8001
  session:
    assistant_id: lead_agent
    config:
      recursion_limit: 1000
      max_step_num: 50
      max_plan_iterations: 10
    context:
      thinking_enabled: true
      is_plan_mode: false
      subagent_enabled: true
  telegram:
    enabled: true
    bot_token: $TELEGRAM_BOT_TOKEN
    allowed_users: []
    session:
      assistant_id: lead_agent
      config:
        recursion_limit: 1000
        max_step_num: 50
        max_plan_iterations: 10
      context:
        thinking_enabled: true
        subagent_enabled: true
