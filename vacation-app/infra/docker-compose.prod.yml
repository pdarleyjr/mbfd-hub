name: mbfd-vacation

services:
  vac-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: vac-nginx
    restart: unless-stopped
    depends_on:
      - vac-web
      - vac-api
    networks: [vac-net]
    ports:
      # Bind to loopback only — Cloudflare Tunnel reads this internally.
      - "127.0.0.1:${NGINX_HOST_PORT:-7090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/__health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  vac-api:
    # Don't expose API/worker/web to the host in production.
    ports: []

  vac-web:
    ports: []

  vac-postgres:
    ports: []

  vac-redis:
    ports: []
