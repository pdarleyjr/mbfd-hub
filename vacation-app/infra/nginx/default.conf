upstream vac_web { server vac-web:3000; }
upstream vac_api { server vac-api:3001; }

server {
    listen 8080 default_server;
    server_name _;

    # Large uploads — Telestaff exports can be huge.
    client_max_body_size 1100m;
    client_body_buffer_size 1m;
    client_body_timeout 600s;
    send_timeout 600s;

    # Health for the compose healthcheck
    location = /__health {
        access_log off;
        add_header content-type text/plain;
        return 200 "ok\n";
    }

    # API + webhook routes
    location /api/ {
        proxy_pass http://vac_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Streaming for uploads and SSE
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://vac_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
