name = "mbfd-support-ai"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "mbfd-rag-index"

[vars]
SUPPORT_HUB_URL = "https://www.mbfdhub.com"
ALLOWED_ORIGIN = "https://www.mbfdhub.com"
# Landing-chat generation uses the private gateway. Retrieval remains on
# Workers AI embeddings + Vectorize. Unique secret AI_GATEWAY_TOKEN and the
# independent INGEST_SECRET are installed with `wrangler secret put`.
AI_GATEWAY_URL = "https://ai-portal.mbfdhub.com"
