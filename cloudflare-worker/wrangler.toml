name = "mbfd-support-ai"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "mbfd-rag-index"

[vars]
SUPPORT_HUB_URL = "https://www.mbfdhub.com"
ALLOWED_ORIGIN = "https://www.mbfdhub.com"
# Local-LLM bridge (Ollama OpenAI-compatible) for landing-chat generation.
# Retrieval still uses Workers AI embeddings + Vectorize. Secrets BRIDGE_TOKEN
# and INGEST_SECRET are set via `wrangler secret put` (never committed).
BRIDGE_URL = "https://office-ai.mbfdhub.com/v1"
BRIDGE_MODEL = "qwen3.6:35b"
