services:
  laravel.test:
    build:
      context: "./vendor/laravel/sail/runtimes/8.5"
      dockerfile: Dockerfile
      args:
        WWWGROUP: "${WWWGROUP}"
    image: "sail-8.5/app"
    container_name: mbfd-hub-laravel
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8090:8080"
    environment:
      WWWUSER: "${WWWUSER}"
      LARAVEL_SAIL: 1
      XDEBUG_MODE: "off"
    volumes:
      - ".:/var/www/html"
      - "${GOOGLE_SA_PATH:-/dev/null}:/run/secrets/google_service_account.json:ro"
      - "./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro"
    networks:
      - mbfd-net
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  pgsql:
    image: "postgres:16.13-alpine"
    container_name: mbfd-hub-pgsql
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - "pgsql-data:/var/lib/postgresql/data"
    networks:
      - mbfd-net
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: "redis:7.4-alpine"
    container_name: mbfd-hub-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - "redis-data:/data"
    networks:
      - mbfd-net
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  baserow:
    image: baserow/baserow@sha256:d6769e1ad959067c5306beef6fe32e3a9ca7f0ebe7c3d8db3922042696e6cb6a
    container_name: mbfd-hub-baserow
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    environment:
      BASEROW_PUBLIC_URL: "${BASEROW_PUBLIC_URL}"
      BASEROW_CADDY_ADDRESSES: ":80"
      BASEROW_SECRET_KEY: "${BASEROW_SECRET_KEY}"
    volumes:
      - baserow-data:/baserow/data
    networks:
      - mbfd-net
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

networks:
  mbfd-net:
    driver: bridge

volumes:
  pgsql-data:
    driver: local
  baserow-data:
    driver: local
  redis-data:
    driver: local
