services:
  laravel.test:
    build:
      context: "./vendor/laravel/sail/runtimes/8.5"
      dockerfile: Dockerfile
      args:
        WWWGROUP: "${WWWGROUP}"
    image: "sail-8.5/app"
    container_name: mbfd-hub-laravel
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8090:8080"
    environment:
      WWWUSER: "${WWWUSER}"
      LARAVEL_SAIL: 1
      XDEBUG_MODE: "off"
    volumes:
      - ".:/var/www/html"
      - "${GOOGLE_SA_PATH:-/dev/null}:/run/secrets/google_service_account.json:ro"
      - "./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro"
    networks:
      - mbfd-net
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Laravel 11 wires /up via bootstrap/app.php (health: '/up').
      # Using /up instead of / gates rolling deploys on actual app readiness,
      # not just nginx accepting the connection.
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  pgsql:
    # Pin to minor version. Bump deliberately after testing against a snapshot
    # — `postgres:16-alpine` would silently absorb major-version-internal jumps.
    image: "postgres:16.13-alpine"
    container_name: mbfd-hub-pgsql
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # PGPASSWORD is for the psql CLIENT — setting it on the server container
      # is redundant (POSTGRES_PASSWORD is what initdb uses) and exposes the
      # secret via /proc/<pid>/environ to any user with docker exec access.
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - "pgsql-data:/var/lib/postgresql/data"
    networks:
      - mbfd-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # pg_isready ignores PGPASSWORD when it runs as the postgres user inside
      # the container, so removing PGPASSWORD doesn't affect this check.
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    # Redis 7-alpine — sized for cache + queue + session + Reverb pub/sub fan-out.
    # AOF persistence keeps queue jobs / sessions safe across container restarts.
    # `appendfsync everysec` is the sweet spot between throughput and durability.
    image: "redis:7.4-alpine"
    container_name: mbfd-hub-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - "redis-data:/data"
    networks:
      - mbfd-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  mbfd-net:
    driver: bridge

volumes:
  pgsql-data:
    driver: local
  redis-data:
    driver: local
