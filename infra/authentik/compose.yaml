name: ${AUTHENTIK_COMPOSE_PROJECT:-mbfd-authentik}

services:
  postgresql:
    image: docker.io/library/postgres:16.10-alpine3.22@sha256:ab8380566c3ea09690a9ecaa85a59d82bfc6eb86744151a2a54335866c83a3e9
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    volumes:
      - ${AUTHENTIK_ROOT:-/opt/mbfd/authentik}/state/postgresql:/var/lib/postgresql/data
    networks: [identity]

  server:
    image: ghcr.io/goauthentik/server:2026.8.2@sha256:c0ab98c3d26d4fe66a513b0ac96ab97abc47cec9d4255abb0ba61e7f2dba1ce0
    platform: linux/amd64
    command: server
    depends_on:
      postgresql: {condition: service_healthy}
    environment: &authentik-environment
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: ${AUTHENTIK_TRUSTED_PROXY_CIDRS:-172.31.244.1/32,127.0.0.1/32}
      AUTHENTIK_WEB__BASE_URL: https://auth.mbfdhub.com
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
    ports:
      - 127.0.0.1:${AUTHENTIK_BIND_PORT:-9000}:9000
    healthcheck:
      test: [CMD, ak, healthcheck]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    shm_size: 512mb
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    volumes:
      - ${AUTHENTIK_ROOT:-/opt/mbfd/authentik}/state/data:/data
      - ${AUTHENTIK_ROOT:-/opt/mbfd/authentik}/custom-templates:/templates:ro
      - ${AUTHENTIK_ROOT:-/opt/mbfd/authentik}/blueprints:/blueprints/mbfd:ro
    networks: [identity, ingress]

  worker:
    image: ghcr.io/goauthentik/server:2026.8.2@sha256:c0ab98c3d26d4fe66a513b0ac96ab97abc47cec9d4255abb0ba61e7f2dba1ce0
    platform: linux/amd64
    command: worker
    depends_on:
      postgresql: {condition: service_healthy}
    environment: *authentik-environment
    healthcheck:
      test: [CMD, ak, healthcheck]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    shm_size: 512mb
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    volumes:
      - ${AUTHENTIK_ROOT:-/opt/mbfd/authentik}/state/data:/data
      - ${AUTHENTIK_ROOT:-/opt/mbfd/authentik}/certs:/certs
      - ${AUTHENTIK_ROOT:-/opt/mbfd/authentik}/custom-templates:/templates:ro
      - ${AUTHENTIK_ROOT:-/opt/mbfd/authentik}/blueprints:/blueprints/mbfd:ro
    networks: [identity]

networks:
  identity:
    internal: true
    ipam:
      config:
        - subnet: ${AUTHENTIK_IDENTITY_SUBNET:-172.31.243.0/28}
  ingress:
    ipam:
      config:
        - subnet: ${AUTHENTIK_INGRESS_SUBNET:-172.31.244.0/28}
