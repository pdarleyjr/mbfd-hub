name: mbfd-livekit-integration

services:
  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  livekit:
    image: livekit/livekit-server:v1.13.5
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: false
        redis:
          address: redis:6379
        room:
          auto_create: false
          empty_timeout: 120
          departure_timeout: 10
          max_participants: 12
          enable_remote_unmute: false
        keys:
          mbfd-integration-key: mbfd-integration-secret-not-for-production
        webhook:
          api_key: mbfd-integration-key
          urls:
            - http://host.docker.internal:8000/webhooks/livekit
