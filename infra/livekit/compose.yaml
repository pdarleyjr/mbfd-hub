name: mbfd-livekit

services:
  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - livekit-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.5
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${LIVEKIT_CERT_DIR:?Set LIVEKIT_CERT_DIR to the certificate directory}:/etc/livekit/certs:ro
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        prometheus_port: 6789
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        redis:
          address: 127.0.0.1:6380
        room:
          auto_create: false
          empty_timeout: 300
          departure_timeout: 30
          max_participants: 12
          enable_remote_unmute: false
        keys:
          ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
          urls:
            - ${LIVEKIT_WEBHOOK_URL:?Set LIVEKIT_WEBHOOK_URL}
        turn:
          enabled: true
          domain: ${LIVEKIT_TURN_DOMAIN:?Set LIVEKIT_TURN_DOMAIN}
          udp_port: 3478
          tls_port: 5349
          cert_file: /etc/livekit/certs/fullchain.pem
          key_file: /etc/livekit/certs/privkey.pem

volumes:
  livekit-redis:
