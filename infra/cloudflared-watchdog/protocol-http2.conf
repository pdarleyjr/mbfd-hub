# Durable fix for recurring QUIC stale-connection outages on connIndex=3.
#
# Root cause (verified 2026-07-22): cloudflared 2026.5.2 ran the tunnel over
# QUIC (UDP). connIndex=3 chronically degraded with QUIC-specific
# "datagram handler" / "accept stream listener" / "control stream" failures,
# causing mid-response request cancellations ("stream ... canceled by remote
# with error code 0") on media.mbfdhub.com. This recurred twice in one day
# (11:41Z and 17:01Z), each requiring a manual cloudflared restart.
#
# Fix: run the tunnel connector over HTTP/2 (TCP). TCP has no QUIC datagram
# sessions to go stale. Connector-only change; does not touch Media Control,
# OBS, the podium, audio, or cameras.
#
# Deploy (post-class OK to re-apply; this is the canonical source):
#   sudo mkdir -p /etc/systemd/system/cloudflared.service.d
#   sudo install -m 0644 protocol-http2.conf \
#       /etc/systemd/system/cloudflared.service.d/protocol-http2.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart cloudflared
# Verify: `journalctl -u cloudflared --since "1 min ago" | grep "Registered tunnel connection"`
# should show `protocol=http2` x4.
#
# Revert: rm the drop-in, `systemctl daemon-reload`, `systemctl restart cloudflared`.
[Service]
ExecStart=
ExecStart=/usr/bin/cloudflared --no-autoupdate tunnel run --protocol http2 --token-file /run/credentials/cloudflared.service/cloudflare-tunnel-token
