# MBFD Hub edge listener (GMKtec host nginx).
#
# Installed as /etc/nginx/conf.d/mbfd-hub-edge-8079.conf. The Cloudflare tunnel sends the Hub
# hostnames (www, apex, files, rosters) here instead of straight to the container on :8080.
# Everything is passed through unchanged. Only when the Hub container cannot be reached at all
# (connection refused or timed out during an image switch or an outage) does this listener answer
# itself: a branded "Updating MBFD Hub" page for page loads, a JSON 503 for everything else.
# Responses the Hub itself sends (its own 503 maintenance page, API errors) are never replaced.
#
# Runbook and rollback: docs/ops/edge-maintenance-page.md

map $http_upgrade $mbfd_hub_edge_connection {
    default upgrade;
    ''      close;
}

# Page loads get the HTML page; fetch/XHR/API callers, workers and webhooks get JSON.
map $http_accept $mbfd_hub_edge_unavailable {
    default       /__mbfd-edge/unavailable.json;
    ~*text/html   /__mbfd-edge/maintenance.html;
}

server {
    listen 127.0.0.1:8079;
    server_name _;
    server_tokens off;

    # Pure pass-through: the container owns limits, buffering, compression and logging.
    client_max_body_size 0;
    client_body_timeout 120s;
    client_header_timeout 30s;
    send_timeout 120s;
    keepalive_timeout 100s;
    large_client_header_buffers 8 64k;
    underscores_in_headers on;
    gzip off;
    access_log off;
    error_log /var/log/nginx/mbfd-hub-edge.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $mbfd_hub_edge_connection;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    proxy_redirect off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 330s;
    proxy_read_timeout 330s;

    # Only nginx's own errors (no connection to the container) are replaced; upstream status
    # codes, including the Hub's own pre-rendered maintenance 503, pass through untouched.
    proxy_intercept_errors off;
    error_page 502 504 =503 $mbfd_hub_edge_unavailable;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    location ^~ /__mbfd-edge/ {
        alias /var/www/mbfd-hub-edge/;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
}
