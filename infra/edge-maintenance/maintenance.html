<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#012766">
<meta name="robots" content="noindex">
<title>Updating MBFD Hub</title>
<!--
  Served by the host edge proxy (infra/edge-maintenance/mbfd-hub-edge.conf) only while the Hub
  container cannot be reached. Self-contained: no application, font, script or stylesheet request
  can depend on the backend that is down. The seal is the one file it loads, from the same edge.
-->
<style>
  :root { --navy: #012766; --ink: #0F172A; --muted: #475569; --line: #DCE2E8; --well: #F3F5F8; --action: #1E4E8C; --action-hover: #1A4378; --focus: #1D4ED8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #FFFFFF; color: var(--ink); }
  body { font: 16px/1.6 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { width: min(100%, 36rem); background: #FFFFFF; border: 1px solid var(--line); border-radius: 12px; padding: clamp(24px, 6vw, 40px); box-shadow: 0 1px 2px rgb(15 23 42 / .06), 0 8px 24px rgb(15 23 42 / .06); }
  .identity { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; color: var(--navy); font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
  .identity img { width: 52px; height: 52px; }
  h1 { margin: 0; color: var(--navy); font-size: clamp(28px, 6vw, 36px); line-height: 1.2; letter-spacing: -.02em; font-weight: 700; }
  p { margin: 16px 0 0; color: var(--muted); }
  .keep { margin-top: 20px; padding: 14px 16px; border-radius: 8px; background: var(--well); border: 1px solid var(--line); color: var(--ink); font-size: 15px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: 28px; }
  button { appearance: none; min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: var(--action); color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: var(--action-hover); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .status { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: no-preference) { button { transition: background-color 120ms ease-out; } }
</style>
</head>
<body>
<main>
  <div class="identity"><img src="/__mbfd-edge/mbfd-official-seal-256.png" alt="" width="52" height="52">MBFD Hub</div>
  <h1>Updating MBFD Hub</h1>
  <p>We're applying an update to improve MBFD Hub. Please try again shortly.</p>
  <p class="keep">If you have a form or other work in progress, keep your current page open.</p>
  <div class="actions">
    <button type="button" id="retry">Try again</button>
    <span class="status" id="status" role="status" aria-live="polite">This page checks again on its own.</span>
  </div>
  <footer>Miami Beach Fire Department · Support Services Division</footer>
</main>
<script>
  // Return the member to the page they asked for as soon as the Hub answers again.
  // /app-release is public, tiny and never cached; anything but a 200 means "not yet".
  (function () {
    var status = document.getElementById('status');
    var delay = 10000, maxDelay = 30000, timer = null;
    function back() { window.location.reload(); }
    function check() {
      timer = null;
      fetch('/app-release', { cache: 'no-store', credentials: 'same-origin', headers: { Accept: 'application/json' } })
        .then(function (r) { if (r.ok) { status.textContent = 'MBFD Hub is back. Opening your page…'; back(); } else { schedule(); } })
        .catch(schedule);
    }
    function schedule() { if (timer === null) { timer = setTimeout(check, delay); delay = Math.min(maxDelay, delay + 5000); } }
    document.getElementById('retry').addEventListener('click', back);
    schedule();
  })();
</script>
</body>
</html>
