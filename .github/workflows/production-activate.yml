name: Production activation

# Manual cutover workflow. Triggered via `gh workflow run production-activate.yml`
# or the GitHub Actions UI. Each toggle is independent — you can flip Redis
# without R2 and vice versa. Both operations:
#   - take a timestamped .env backup BEFORE writing anything
#   - rebuild config cache so the new env values take effect
#   - re-run a readiness probe / smoke test AFTER the flip
#
# Rollback procedure for either: SSH to deploy-target, restore the .env.pre-*
# backup that this workflow created, then run `php artisan config:cache`.
# Backups are tagged with the workflow run id for traceability.

on:
  workflow_dispatch:
    inputs:
      activate_redis:
        description: 'Flip CACHE_STORE / QUEUE_CONNECTION / SESSION_DRIVER / BROADCAST_DRIVER to redis (+reverb)'
        required: false
        type: boolean
        default: false
      activate_r2:
        description: 'Switch FILESYSTEM_DISK=r2 + write R2_* env vars. Requires R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY repo secrets.'
        required: false
        type: boolean
        default: false
      rollback:
        description: 'EMERGENCY: restore the most recent .env.pre-activate-* backup. Use if cutover broke prod.'
        required: false
        type: boolean
        default: false
      diagnose:
        description: 'Print redacted Redis env diagnostics — comparing .env values vs what Laravel sees vs what redis-cli accepts. Read-only.'
        required: false
        type: boolean
        default: false
      quote_password:
        description: 'Idempotently single-quote REDIS_PASSWORD in .env so phpdotenv treats it literally. No driver flips. Safe to run repeatedly.'
        required: false
        type: boolean
        default: false
      rotate_redis_password:
        description: 'Generate a strong random REDIS_PASSWORD, write to .env, recreate the redis container so Redis itself uses the new password. Required because the current value is literally `null` which Laravel env() always returns as PHP null.'
        required: false
        type: boolean
        default: false
      verify_redis:
        description: 'Read-only: run `php artisan mbfd:activate-redis --dry-run` to show which drivers are currently on redis/reverb.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: self-hosted
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.mbfdhub.com
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null || true
          touch ~/.ssh/config
          cp ~/.ssh/config ~/.ssh/config.before-production-activate-${{ github.run_id }}
          python3 - <<'PY'
          from pathlib import Path

          path = Path.home() / '.ssh' / 'config'
          lines = path.read_text().splitlines()
          kept = []
          skip = False

          for line in lines:
              stripped = line.strip()
              lower = stripped.lower()
              if lower.startswith('host ') or lower.startswith('match '):
                  skip = lower.startswith('host ') and 'deploy-target' in stripped.split()[1:]
              if not skip:
                  kept.append(line)

          path.write_text('\n'.join(kept).rstrip() + '\n')
          PY
          cat >> ~/.ssh/config << EOF
          Host deploy-target
            HostName 127.0.0.1
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ConnectTimeout 10
            ServerAliveInterval 10
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      # =======================================================================
      # DIAGNOSE — read-only, uses the artisan command which bootstraps Laravel
      # so env() is available. Prints redacted info only (lengths + char ords).
      # =======================================================================
      - name: Diagnose Redis env
        if: ${{ inputs.diagnose }}
        run: |
          ssh deploy-target 'docker exec mbfd-hub-laravel php artisan mbfd:diagnose-redis'

      # =======================================================================
      # VERIFY_REDIS — read-only driver-status check via the activate-redis probe.
      # =======================================================================
      - name: Verify Redis driver status
        if: ${{ inputs.verify_redis }}
        run: |
          ssh deploy-target 'docker exec mbfd-hub-laravel php artisan mbfd:activate-redis --dry-run'

      # =======================================================================
      # QUOTE_PASSWORD — apply quote-fix to REDIS_PASSWORD only, no driver flips.
      # =======================================================================
      # =======================================================================
      # ROTATE_REDIS_PASSWORD — generates a strong random password and writes
      # to .env. Recreates the redis container so Redis itself uses the new
      # password. Required because the current value `null` is auto-typed to
      # PHP null by Laravel env(), causing NOAUTH.
      # =======================================================================
      - name: Rotate REDIS_PASSWORD + recreate redis container
        if: ${{ inputs.rotate_redis_password }}
        run: |
          ssh deploy-target 'bash -s' <<'REMOTE_EOF'
          set -e
          cd /opt/mbfd/mbfd-hub
          TS=$(date +%Y%m%d_%H%M%S)
          cp .env ".env.pre-activate-${TS}-${{ github.run_id }}"

          # Generate strong 64-hex-char password. No special chars → no dotenv
          # parsing ambiguity. We write it to .env, then recreate the redis
          # container so the new password takes effect at requirepass time.
          NEW_PWD=$(openssl rand -hex 32)

          # Replace or insert the REDIS_PASSWORD line (single-quoted as belt+suspenders;
          # not strictly needed for hex but cheap to add).
          if grep -qE '^REDIS_PASSWORD=' .env; then
            # Use a different delimiter than | because the value is hex (no |).
            # Use ~ and ensure NEW_PWD has no ~ (hex doesn't).
            sed -i -E "s~^REDIS_PASSWORD=.*~REDIS_PASSWORD='${NEW_PWD}'~" .env
            echo "✓ Rewrote REDIS_PASSWORD line in .env"
          else
            echo "REDIS_PASSWORD='${NEW_PWD}'" >> .env
            echo "✓ Appended REDIS_PASSWORD to .env"
          fi
          unset NEW_PWD  # don't leave it in the shell env

          # Recreate the redis container so it picks up the new requirepass.
          # AOF persistence (--appendonly yes in compose.prod.yaml) means cached
          # data survives the restart.
          docker compose -f compose.prod.yaml up -d --force-recreate redis
          echo "✓ Recreated redis container"

          # Wait up to 30s for redis to be healthy with the new password
          for i in $(seq 1 30); do
            PWD_NEW=$(grep -E "^REDIS_PASSWORD='" .env | head -1 | sed -E "s/^REDIS_PASSWORD='(.*)'$/\1/")
            if docker exec mbfd-hub-redis redis-cli -a "$PWD_NEW" --no-auth-warning ping 2>/dev/null | grep -q PONG; then
              echo "✓ Redis healthy with new password after ${i}s"
              unset PWD_NEW
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "::error::Redis did not become healthy with new password within 30s"
              exit 1
            fi
          done

          # Rebuild Laravel config so it reads the new password
          docker exec mbfd-hub-laravel php artisan config:cache
          echo "✓ Config cached"

          # Confirm via the Laravel-bootstrapped diagnostic
          docker exec mbfd-hub-laravel php artisan mbfd:diagnose-redis
          REMOTE_EOF

      - name: Quote REDIS_PASSWORD in .env
        if: ${{ inputs.quote_password }}
        run: |
          ssh deploy-target 'bash -s' <<'REMOTE_EOF'
          set -e
          cd /opt/mbfd/mbfd-hub
          TS=$(date +%Y%m%d_%H%M%S)
          cp .env ".env.pre-activate-${TS}-${{ github.run_id }}"
          if grep -qE '^REDIS_PASSWORD=' .env; then
            if grep -qE "^REDIS_PASSWORD='" .env || grep -qE '^REDIS_PASSWORD="' .env; then
              echo "REDIS_PASSWORD is already quoted — no change"
            else
              sed -i -E "s|^REDIS_PASSWORD=(.+)|REDIS_PASSWORD='\1'|" .env
              echo "✓ Single-quoted REDIS_PASSWORD"
              docker exec mbfd-hub-laravel php artisan config:cache
              echo "✓ Config cached"
            fi
          else
            echo "::warning::REDIS_PASSWORD not found in .env"
          fi
          REMOTE_EOF

      - name: Pre-flight .env backup
        if: ${{ ! inputs.rollback && ! inputs.diagnose && ! inputs.quote_password && ! inputs.rotate_redis_password && ! inputs.verify_redis }}
        run: |
          ssh deploy-target 'bash -s' <<'REMOTE_EOF'
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          cd /opt/mbfd/mbfd-hub
          cp .env ".env.pre-activate-${TS}-${{ github.run_id }}"
          echo "::notice::Backed up .env to .env.pre-activate-${TS}-${{ github.run_id }}"
          ls -la .env.pre-activate-${TS}* | head -1
          REMOTE_EOF

      # =======================================================================
      # ROLLBACK
      # =======================================================================
      - name: Rollback to most recent backup
        if: ${{ inputs.rollback }}
        run: |
          ssh deploy-target 'bash -s' <<'REMOTE_EOF'
          set -e
          cd /opt/mbfd/mbfd-hub
          # Most recent .env.pre-activate-* backup wins
          LATEST=$(ls -t .env.pre-activate-* 2>/dev/null | head -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No .env.pre-activate-* backups found"
            exit 1
          fi
          echo "Restoring from: $LATEST"
          # Keep a copy of the broken state in case we need forensics
          cp .env ".env.rollback-from-${{ github.run_id }}"
          cp "$LATEST" .env
          docker exec mbfd-hub-laravel php artisan config:cache
          docker exec mbfd-hub-laravel php artisan queue:restart || true
          docker exec mbfd-hub-laravel bash -c 'pkill -f "reverb:start" || true'
          sleep 2
          docker exec mbfd-hub-laravel bash -c 'nohup php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction > /tmp/reverb.log 2>&1 &'
          docker exec mbfd-hub-laravel bash -c 'pkill -f "queue:work" || true'
          sleep 2
          docker exec mbfd-hub-laravel bash -c 'nohup php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 > /tmp/queue-worker.log 2>&1 &'
          echo "✓ Restored .env from $LATEST"
          REMOTE_EOF

      # =======================================================================
      # REDIS
      # =======================================================================
      # We can't pre-flight via `php artisan mbfd:activate-redis --dry-run`
      # because that command reads REDIS_HOST from .env, which is still the
      # default 127.0.0.1 BEFORE the cutover (correct value `redis` only lands
      # post-flip). Ping the Redis container directly instead — that proves
      # the redis service is up + the password we have in .env is correct,
      # without depending on Laravel's current config.
      - name: Redis container ping (pre-flip)
        if: ${{ inputs.activate_redis && ! inputs.rollback }}
        run: |
          ssh deploy-target 'bash -s' <<'REMOTE_EOF'
          set -e
          PWD=$(grep -E '^REDIS_PASSWORD=' /opt/mbfd/mbfd-hub/.env | head -1 | cut -d= -f2-)
          # Strip matched outer quotes (phpdotenv-style). bash parameter
          # expansion handles this without spawning a subshell that would
          # leak the value into ps output.
          PWD="${PWD#\'}"; PWD="${PWD%\'}"
          PWD="${PWD#\"}"; PWD="${PWD%\"}"
          if [ -z "$PWD" ]; then
            echo "::error::REDIS_PASSWORD is not set in production .env — Redis activation cannot proceed."
            exit 1
          fi
          REPLY=$(docker exec mbfd-hub-redis redis-cli -a "$PWD" --no-auth-warning ping 2>&1)
          if [ "$REPLY" != "PONG" ]; then
            echo "::error::Redis container did not respond PONG (got: $REPLY)"
            exit 1
          fi
          echo "✓ Redis container responded PONG"
          REMOTE_EOF

      - name: Activate Redis
        if: ${{ inputs.activate_redis && ! inputs.rollback }}
        run: |
          ssh deploy-target 'bash -s' <<'REMOTE_EOF'
          set -e
          cd /opt/mbfd/mbfd-hub

          # Sanity check: config('database.redis.default.password') must be a
          # non-empty string. Laravel's env() auto-types 'null' to PHP null,
          # which caused the first cutover attempt to send no AUTH. With config
          # cached, env() always returns null, so we check the cached config
          # value (which IS resolved at config:cache time). The
          # rotate_redis_password step is the supported way to fix the
          # underlying issue.
          docker exec mbfd-hub-laravel php artisan tinker --execute='
            $pwd = config("database.redis.default.password");
            if ($pwd === null || $pwd === "") {
              throw new \RuntimeException("config(database.redis.default.password) is empty/null. Run with rotate_redis_password=true first.");
            }
            echo "Pre-flip config check OK (password length=".strlen($pwd).")\n";
          '

          # Strip any prior occurrences so Laravel reads the last (block we append)
          # without warning about duplicate keys.
          sed -i '/^CACHE_STORE=/d' .env
          sed -i '/^QUEUE_CONNECTION=/d' .env
          sed -i '/^SESSION_DRIVER=/d' .env
          sed -i '/^BROADCAST_DRIVER=/d' .env
          sed -i '/^BROADCAST_CONNECTION=/d' .env

          # REDIS_HOST: the docker-compose service name 'redis' resolves inside
          # the network. Strip stale values that may have referenced 127.0.0.1.
          sed -i '/^REDIS_HOST=/d' .env

          # Append the activation block. REDIS_PASSWORD / REDIS_PORT are already
          # in the production .env (Redis container is healthy with them) — we
          # don't re-write them here, only the values that need to flip.
          cat >> .env <<'BLOCK'

          # --- Redis cutover (managed by production-activate.yml) ---------
          CACHE_STORE=redis
          QUEUE_CONNECTION=redis
          SESSION_DRIVER=redis
          BROADCAST_DRIVER=reverb
          BROADCAST_CONNECTION=reverb
          REDIS_HOST=redis
          # ----------------------------------------------------------------
          BLOCK

          # Rebuild the config cache so the new env takes effect.
          docker exec mbfd-hub-laravel php artisan config:cache

          # Drain any in-flight DB-queued jobs before the worker re-reads its
          # connection config. Already-queued DB jobs stay on DB; new dispatches
          # route to Redis.
          docker exec mbfd-hub-laravel php artisan queue:restart

          echo "✓ Redis cutover applied to .env + config cache"
          REMOTE_EOF

      # Restart the whole Laravel container so supervisord respawns Reverb +
      # queue:work using the freshly cached config. Previously we tried
      # pkill+nohup inside docker exec, which caused the SSH session to be
      # SIGTERM'd at exit (exit code 143) and made the step report failure even
      # though the cutover actually applied. `docker restart` is clean,
      # supervised, and ~5-10s of downtime.
      - name: Restart Laravel container so supervisord picks up new env
        if: ${{ inputs.activate_redis && ! inputs.rollback }}
        run: |
          ssh deploy-target 'docker restart mbfd-hub-laravel && echo "✓ Laravel container restarted"'

      - name: Wait for Laravel health after restart
        if: ${{ inputs.activate_redis && ! inputs.rollback }}
        run: |
          for i in $(seq 1 60); do
            if ssh deploy-target 'docker exec mbfd-hub-laravel curl -sf http://localhost:80/up' > /dev/null 2>&1; then
              echo "✓ Laravel /up healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Laravel did not become healthy within 60s of restart"
          exit 1

      - name: Redis post-flip verification
        if: ${{ inputs.activate_redis && ! inputs.rollback }}
        run: |
          ssh deploy-target 'docker exec mbfd-hub-laravel php artisan mbfd:activate-redis --dry-run' | tee /tmp/redis-probe.log
          if ! grep -q '✓ All four drivers already point at redis/reverb' /tmp/redis-probe.log; then
            echo "::error::Redis activation probe did not report all-green after flip"
            exit 1
          fi

      # =======================================================================
      # R2
      # =======================================================================
      - name: Validate R2 secrets are present
        if: ${{ inputs.activate_r2 && ! inputs.rollback }}
        env:
          R2_AK: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SK: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$R2_AK" ] || [ -z "$R2_SK" ]; then
            echo "::error::R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY repo secrets must be set before activating R2."
            echo "::error::Generate the keys at: https://dash.cloudflare.com/265122b6d6f29457b0ca950c55f3ac6e/r2/api-tokens"
            echo "::error::Then: gh secret set R2_ACCESS_KEY_ID -R pdarleyjr/mbfd-hub --body '...'"
            echo "::error::       gh secret set R2_SECRET_ACCESS_KEY -R pdarleyjr/mbfd-hub --body '...'"
            exit 1
          fi

      - name: Activate R2 disk
        if: ${{ inputs.activate_r2 && ! inputs.rollback }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # Stream the env block as stdin to remote `cat > /tmp/r2.env.add`.
          # Using a single-quoted outer ssh + a double-quoted heredoc on the
          # runner side lets shell-expand the secrets WITHOUT the values
          # touching the remote process list.
          # This local expansion is intentional and is why EOF is not quoted.
          # shellcheck disable=SC2087
          ssh deploy-target 'cat > /tmp/r2.env.add' <<EOF
          # --- R2 disk activated (managed by production-activate.yml) -----
          FILESYSTEM_DISK=r2
          R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
          R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
          R2_BUCKET=mbfd-hub-media
          R2_ENDPOINT=https://265122b6d6f29457b0ca950c55f3ac6e.r2.cloudflarestorage.com
          R2_REGION=auto
          # ----------------------------------------------------------------
          EOF

          ssh deploy-target 'bash -s' <<'REMOTE_EOF'
          set -e
          cd /opt/mbfd/mbfd-hub
          sed -i '/^FILESYSTEM_DISK=/d' .env
          sed -i '/^R2_ACCESS_KEY_ID=/d' .env
          sed -i '/^R2_SECRET_ACCESS_KEY=/d' .env
          sed -i '/^R2_BUCKET=/d' .env
          sed -i '/^R2_ENDPOINT=/d' .env
          sed -i '/^R2_REGION=/d' .env
          # Append block, then wipe the temp file (which contained the secrets in plaintext)
          cat /tmp/r2.env.add >> .env
          shred -u /tmp/r2.env.add 2>/dev/null || rm -f /tmp/r2.env.add
          docker exec mbfd-hub-laravel php artisan config:cache
          # Round-trip a tiny object to prove keys work. Output PUT_OK on success.
          docker exec mbfd-hub-laravel php artisan mbfd:probe-r2 || {
            echo "::warning::R2 probe failed — keys may be wrong or bucket policy mismatched. Rollback: restore .env.pre-activate-* backup."
            exit 1
          }
          echo "✓ R2 disk activated"
          REMOTE_EOF

      # =======================================================================
      # SMOKE
      # =======================================================================
      - name: Post-activation smoke tests
        run: |
          PASS=0; FAIL=0
          check() {
            local desc="$1" url="$2" expected="${3:-200}"
            HTTP=$(curl -sL -o /dev/null -w "%{http_code}" "$url" --max-time 15)
            if [ "$HTTP" = "$expected" ]; then
              echo "✓ $desc → HTTP $HTTP"
              PASS=$((PASS + 1))
            else
              echo "::error::$desc → HTTP $HTTP (expected $expected)"
              FAIL=$((FAIL + 1))
            fi
          }
          echo "=== Post-Activation Smoke ==="
          sleep 3
          check "Landing"                "https://www.mbfdhub.com/"
          check "Admin login"            "https://www.mbfdhub.com/admin/login"
          check "/up health"             "https://www.mbfdhub.com/up"
          check "Admin PWA manifest"     "https://www.mbfdhub.com/admin-pwa/manifest.webmanifest"
          check "Admin PWA SW"           "https://www.mbfdhub.com/admin/service-worker.js"
          check "Deploy marker"          "https://www.mbfdhub.com/deploy-marker.json"
          echo "=== $PASS passed, $FAIL failed ==="
          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi
