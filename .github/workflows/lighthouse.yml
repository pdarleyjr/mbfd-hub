name: Lighthouse CI

on:
  workflow_run:
    workflows: ["Deploy to Production"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Audit URLs using Lighthouse
        uses: treosh/lighthouse-ci-action@512cc908a55bfb0ad231facca52adf3d3a651df4 # v12
        with:
          urls: |
            https://www.mbfdhub.com/
          configPath: ./.lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: false

      # lighthouse-ci-action v12 currently records assertion failures without
      # propagating the LHCI process exit code. Run the pinned official CLI
      # against the collected reports so an error-level regression fails CI.
      - name: Enforce Lighthouse assertions
        run: npx --yes @lhci/cli@0.15.1 assert --config=.lighthouserc.cjs --includePassedAssertions
