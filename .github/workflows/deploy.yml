name: Deploy approved Hub candidate

# A merge to main runs CI only. Production activation requires a deliberate
# dispatch from main, an explicit confirmation, exact-SHA release gates, and
# protected production-environment approval.
on:
  workflow_dispatch:
    inputs:
      confirm_production_activation:
        description: 'I confirm this approved main candidate may activate the MBFD Hub production runtime.'
        required: true
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assert-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main and explicit activation confirmation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirm_production_activation }}" = "true"
          test -n "$GITHUB_SHA"

  release-gates:
    needs: assert-main
    uses: ./.github/workflows/hub-release-gates.yml
    with:
      pint_base_sha: ${{ format('{0}^', github.sha) }}

  deploy:
    needs: release-gates
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: self-hosted
    timeout-minutes: 60
    environment:
      name: production
      url: https://www.mbfdhub.com
    steps:
      - name: Configure ephemeral Hub deployment SSH target
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.MBFD_HUB_SSH_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.MBFD_HUB_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          SSH_DIR="$RUNNER_TEMP/mbfd-hub-ssh"
          install -d -m 700 "$SSH_DIR"
          printf '%s\n' "$DEPLOY_KEY" > "$SSH_DIR/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          printf 'Host deploy-target\n  HostName %s\n  User %s\n  IdentityFile %s\n  UserKnownHostsFile %s\n  StrictHostKeyChecking yes\n  ConnectTimeout 10\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$SSH_DIR/deploy_key" "$SSH_DIR/known_hosts" > "$SSH_DIR/config"
          chmod 600 "$SSH_DIR/deploy_key" "$SSH_DIR/config"
          printf 'HUB_SSH_CONFIG=%s\n' "$SSH_DIR/config" >> "$GITHUB_ENV"

      - name: Inspect Hub production checkout and runtime
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          ssh -F "$HUB_SSH_CONFIG" deploy-target "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          HUB_CHECKOUT=/opt/mbfd/mbfd-hub
          HUB_APP_CONTAINER=mbfd-hub-laravel
          HUB_PG_CONTAINER=mbfd-hub-pgsql
          HUB_PG_DATABASE=mbfd_hub
          HUB_PG_USER=mbfd_user

          test -d "$HUB_CHECKOUT/.git"
          cd "$HUB_CHECKOUT"
          git status --short --branch
          git diff --stat
          if test -n "$(git status --porcelain)"; then
            echo 'Refusing to overwrite a dirty production checkout.' >&2
            exit 1
          fi

          test "$(docker inspect --format '{{.Name}}' "$HUB_APP_CONTAINER")" = "/$HUB_APP_CONTAINER"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$HUB_APP_CONTAINER")" = 'laravel.test'
          test "$(docker inspect --format '{{.Name}}' "$HUB_PG_CONTAINER")" = "/$HUB_PG_CONTAINER"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$HUB_PG_CONTAINER")" = 'pgsql'
          test "$(docker inspect --format '{{.State.Running}}' "$HUB_APP_CONTAINER")" = 'true'
          test "$(docker inspect --format '{{.State.Running}}' "$HUB_PG_CONTAINER")" = 'true'
          docker exec "$HUB_PG_CONTAINER" pg_isready -q -d "$HUB_PG_DATABASE" -U "$HUB_PG_USER"
          TRT_DUPLICATE_DATES="$(docker exec "$HUB_PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U "$HUB_PG_USER" -d "$HUB_PG_DATABASE" -Atqc \
            'SELECT session_date FROM trt_inventory_sessions WHERE trailer_id IS NULL GROUP BY session_date HAVING COUNT(*) > 1')"
          if test -n "$TRT_DUPLICATE_DATES"; then
            echo 'TRT default-session duplicates require deliberate data reconciliation before migration.' >&2
            printf '%s\n' "$TRT_DUPLICATE_DATES" >&2
            exit 1
          fi
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan migrate:status --no-ansi
          REMOTE

      - name: Verify targeted Hub database backup
        env:
          RELEASE_SHA: ${{ github.sha }}
          HUB_BACKUP_DIR: ${{ vars.MBFD_HUB_BACKUP_DIR }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          test -n "$HUB_BACKUP_DIR"
          ssh -F "$HUB_SSH_CONFIG" deploy-target "RELEASE_SHA='$RELEASE_SHA' HUB_BACKUP_DIR='$HUB_BACKUP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          HUB_CHECKOUT=/opt/mbfd/mbfd-hub
          HUB_PG_CONTAINER=mbfd-hub-pgsql
          HUB_PG_DATABASE=mbfd_hub
          HUB_PG_USER=mbfd_user

          test "$(docker inspect --format '{{.Name}}' "$HUB_PG_CONTAINER")" = "/$HUB_PG_CONTAINER"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$HUB_PG_CONTAINER")" = 'pgsql'
          case "$HUB_BACKUP_DIR" in
            /var/lib/postgresql/data|/var/lib/postgresql/data/*|'')
              echo 'Hub backup storage must be outside the PostgreSQL data volume.' >&2
              exit 1
              ;;
           esac
           PG_DATA_SOURCE="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Source}}{{end}}{{end}}' "$HUB_PG_CONTAINER")"
           test -n "$PG_DATA_SOURCE"
           BACKUP_PATH_HELPER_IMAGE=sail-8.5/app
           case "$PG_DATA_SOURCE" in
             /mnt/*) PG_DATA_SOURCE_IN_HELPER="/host-mnt/${PG_DATA_SOURCE#/mnt/}" ;;
             *)
               echo 'Hub PostgreSQL data source must be mounted below /mnt for isolated path validation.' >&2
               exit 1
               ;;
           esac
           case "$HUB_BACKUP_DIR" in
             /mnt/*) HUB_BACKUP_DIR_IN_HELPER="/host-mnt/${HUB_BACKUP_DIR#/mnt/}" ;;
             *)
               echo 'Hub backup storage must be mounted below /mnt for isolated path validation.' >&2
               exit 1
               ;;
           esac
           docker run --rm --network none --pull=never --read-only --cap-drop=ALL --entrypoint sh \
             --mount type=bind,src=/mnt,dst=/host-mnt,readonly \
             "$BACKUP_PATH_HELPER_IMAGE" -euc '
               PG_DATA_SOURCE_REAL="$(realpath -e -- "$1")"
               HUB_BACKUP_DIR_REAL="$(realpath -e -- "$2")"
               case "$HUB_BACKUP_DIR_REAL" in
                 "$PG_DATA_SOURCE_REAL"|"$PG_DATA_SOURCE_REAL"/*)
                   echo "Hub backup storage resolves inside the PostgreSQL data source." >&2
                   exit 1
                   ;;
               esac
             ' sh "$PG_DATA_SOURCE_IN_HELPER" "$HUB_BACKUP_DIR_IN_HELPER"
           test -d "$HUB_BACKUP_DIR"
           test -w "$HUB_BACKUP_DIR"

           cd "$HUB_CHECKOUT"
           PREVIOUS_SHA="$(git rev-parse HEAD)"
           BACKUP_ID="mbfd-hub-pre-activation-$(date -u +%Y%m%dT%H%M%SZ)-$RELEASE_SHA"
           BACKUP_FILE="$HUB_BACKUP_DIR/$BACKUP_ID.dump"
          umask 077
          docker exec "$HUB_PG_CONTAINER" pg_dump -U "$HUB_PG_USER" -Fc "$HUB_PG_DATABASE" > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          docker exec -i "$HUB_PG_CONTAINER" pg_restore --list - < "$BACKUP_FILE" > /dev/null
           BACKUP_SHA256="$(sha256sum "$BACKUP_FILE" | awk '{print $1}')"
           printf 'release_sha=%s\nprevious_sha=%s\ncreated_at=%s\nbackup_file=%s\nsha256=%s\n' \
             "$RELEASE_SHA" "$PREVIOUS_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$BACKUP_FILE" "$BACKUP_SHA256" > "$HUB_BACKUP_DIR/$BACKUP_ID.metadata"
          echo "Verified Hub backup: $BACKUP_FILE sha256=$BACKUP_SHA256"
          REMOTE

      - name: Enter maintenance mode and verify queue safety
        run: |
          set -euo pipefail
          ssh -F "$HUB_SSH_CONFIG" deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan down --render=errors::503
          test "$(docker exec "$HUB_APP_CONTAINER" curl -sS -o /dev/null -w '%{http_code}' http://localhost/)" = '503'
          QUEUE_PROCESSES="$(docker exec "$HUB_APP_CONTAINER" pgrep -af 'artisan queue:work' || true)"
          test -n "$QUEUE_PROCESSES"
          if printf '%s\n' "$QUEUE_PROCESSES" | grep -Eq -- '(^|[[:space:]])--force([[:space:]]|$)'; then
            echo 'Refusing activation while a queue worker bypasses maintenance mode.' >&2
            exit 1
          fi
          REMOTE

      - name: Checkout exact approved candidate
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          ssh -F "$HUB_SSH_CONFIG" deploy-target "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/mbfd/mbfd-hub
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          git cat-file -e "$RELEASE_SHA^{commit}"
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          REMOTE

      - name: Migrate, build, and atomically swap Hub assets
        run: |
          set -euo pipefail
          ssh -F "$HUB_SSH_CONFIG" deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          cd /opt/mbfd/mbfd-hub
          test "$(docker inspect --format '{{.Name}}' "$HUB_APP_CONTAINER")" = "/$HUB_APP_CONTAINER"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$HUB_APP_CONTAINER")" = 'laravel.test'
          docker exec -u sail "$HUB_APP_CONTAINER" composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan migrate:status --no-ansi
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan migrate --force
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan optimize:clear
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan config:cache
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan route:cache
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan view:cache
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan filament:clear-cached-components
          docker exec -u sail "$HUB_APP_CONTAINER" bash -lc 'set -euo pipefail
            cd /var/www/html
            rm -rf -- public/build-next public/daily-next
            npm ci --legacy-peer-deps
            npx vite build --outDir public/build-next --emptyOutDir
            test -s public/build-next/manifest.json
            php artisan filament:assets
            cd resources/js/daily-checkout
            npm ci --legacy-peer-deps
            DAILY_CHECKOUT_OUT_DIR=../../../public/daily-next npm run build
            test -s ../../../public/daily-next/index.html
          '
          docker exec -u sail "$HUB_APP_CONTAINER" bash -lc 'set -euo pipefail
            cd /var/www/html
            test -s public/build-next/manifest.json
            test -s public/daily-next/index.html
            archive_suffix=$(date -u +%Y%m%dT%H%M%SZ)
            if test -e public/build-previous; then mv -- public/build-previous "public/build-previous-$archive_suffix"; fi
            if test -e public/daily-previous; then mv -- public/daily-previous "public/daily-previous-$archive_suffix"; fi
            if test -d public/build; then mv -- public/build public/build-previous; fi
            if test -d public/daily; then mv -- public/daily public/daily-previous; fi
            mv -- public/build-next public/build
            mv -- public/daily-next public/daily
            test -s public/build/manifest.json
            test -s public/daily/index.html
          '
          docker compose -f compose.prod.yaml up -d --build --no-deps --force-recreate laravel.test
          REMOTE

      - name: Verify Hub application health
        run: |
          set -euo pipefail
          ssh -F "$HUB_SSH_CONFIG" deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          for _ in $(seq 1 60); do
            if docker inspect --format='{{.State.Health.Status}}' "$HUB_APP_CONTAINER" | grep -qx healthy \
              && docker exec "$HUB_APP_CONTAINER" curl -fsS http://localhost:80/up > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'MBFD Hub application did not become healthy after activation.' >&2
          exit 1
          REMOTE

      - name: Restart Hub queues and verify background services
        run: |
          set -euo pipefail
          ssh -F "$HUB_SSH_CONFIG" deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          CACHE_DRIVER="$(docker exec -u sail "$HUB_APP_CONTAINER" php -r '
          require "/var/www/html/vendor/autoload.php";
          $app = require "/var/www/html/bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          echo config("cache.default");
          ')"
          case "$CACHE_DRIVER" in
            ''|array)
              echo 'Queue restart requires a shared, healthy cache driver.' >&2
              exit 1
              ;;
          esac
          docker exec -u sail "$HUB_APP_CONTAINER" php -r '
          require "/var/www/html/vendor/autoload.php";
          $app = require "/var/www/html/bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $cache = $app->make("cache");
          $key = "mbfd_release_queue_restart_probe";
          $cache->put($key, "ok", 60);
          if ($cache->get($key) !== "ok") { exit(1); }
          $cache->forget($key);
          '
          QUEUE_BEFORE="$(docker exec "$HUB_APP_CONTAINER" pgrep -f 'artisan queue:work' | sort | tr '\n' ' ')"
          test -n "$QUEUE_BEFORE"
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan queue:restart
          for _ in $(seq 1 60); do
            QUEUE_AFTER="$(docker exec "$HUB_APP_CONTAINER" pgrep -f 'artisan queue:work' | sort | tr '\n' ' ')"
            if test -n "$QUEUE_AFTER" && test "$QUEUE_AFTER" != "$QUEUE_BEFORE"; then
              break
            fi
            sleep 1
          done
          test -n "${QUEUE_AFTER:-}"
          test "$QUEUE_AFTER" != "$QUEUE_BEFORE"
          docker exec "$HUB_APP_CONTAINER" supervisorctl status
          docker exec "$HUB_APP_CONTAINER" pgrep -af '^/usr/bin/php /var/www/html/artisan reverb:start '
          docker exec "$HUB_APP_CONTAINER" pgrep -af '^/usr/bin/php /var/www/html/artisan queue:work '
          REMOTE

      - name: Leave maintenance mode and verify internal health
        run: |
          set -euo pipefail
          ssh -F "$HUB_SSH_CONFIG" deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan up
          test "$(docker exec "$HUB_APP_CONTAINER" curl -sS -o /dev/null -w '%{http_code}' http://localhost/up)" = '200'
          REMOTE

      - name: Record successful Hub candidate activation
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          ssh -F "$HUB_SSH_CONFIG" deploy-target "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/mbfd/mbfd-hub
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          printf '{"sha":"%s","deployed_at":"%s"}\n' "$RELEASE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/deploy-marker.json
          REMOTE

      - name: Verify public Hub smoke routes
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 15 https://www.mbfdhub.com/up > /dev/null
          test "$(curl --silent --show-error --location --max-time 15 --output /dev/null --write-out '%{http_code}' https://www.mbfdhub.com/)" = '200'
