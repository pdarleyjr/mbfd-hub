name: Deploy approved Hub candidate

# No push trigger by design. A merge to main only runs CI. An operator must
# explicitly dispatch this workflow from main, confirm the activation, pass the
# same release gates for that exact SHA, and receive the production environment
# approval before this workflow can mutate the Hub runtime.
on:
  workflow_dispatch:
    inputs:
      confirm_production_activation:
        description: 'I confirm this approved main candidate may activate the MBFD Hub production runtime.'
        required: true
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # workflow_dispatch permits selecting a ref in the Actions UI. A non-main
  # dispatch is skipped here and cannot reach the reusable gate or deployment.
  assert-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main and explicit activation confirmation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirm_production_activation }}" = "true"
          test -n "$GITHUB_SHA"

  release-gates:
    needs: assert-main
    uses: ./.github/workflows/hub-release-gates.yml
    with:
      # CI has already checked the PR/base range before merge. Rechecking the
      # exact dispatched main candidate against its first parent catches a
      # post-merge source change without inventing an unavailable PR context.
      pint_base_sha: ${{ format('{0}^', github.sha) }}

  deploy:
    needs: release-gates
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: production
      url: https://www.mbfdhub.com
    steps:
      - name: Setup Hub deployment SSH target
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > "$HOME/.ssh/mbfd_hub_deploy_key"
          chmod 600 "$HOME/.ssh/mbfd_hub_deploy_key"
          ssh-keyscan -H 127.0.0.1 >> "$HOME/.ssh/known_hosts"
          cat >> "$HOME/.ssh/config" <<EOF
          Host deploy-target
            HostName 127.0.0.1
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile $HOME/.ssh/mbfd_hub_deploy_key
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ServerAliveInterval 10
            ServerAliveCountMax 3
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Verify targeted Hub database backup
        run: |
          set -euo pipefail
          RELEASE_SHA="$GITHUB_SHA"
          test -n "$RELEASE_SHA"
          # This quoted heredoc is intentionally evaluated on the remote host.
          # shellcheck disable=SC2029
          ssh deploy-target "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          HUB_PG_CONTAINER=mbfd-hub-pgsql
          HUB_APP_CONTAINER=mbfd-hub-laravel
          HUB_PG_DATABASE=mbfd_hub
          HUB_PG_USER=mbfd_user

          test "$(docker inspect --format '{{.Name}}' "$HUB_PG_CONTAINER")" = "/$HUB_PG_CONTAINER"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$HUB_PG_CONTAINER")" = "pgsql"
          test "$(docker inspect --format '{{.State.Running}}' "$HUB_PG_CONTAINER")" = "true"
          test "$(docker inspect --format '{{.Name}}' "$HUB_APP_CONTAINER")" = "/$HUB_APP_CONTAINER"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$HUB_APP_CONTAINER")" = "laravel.test"

          HUB_APP_DATABASE="$(docker exec -u sail "$HUB_APP_CONTAINER" php -r '
          require "/var/www/html/vendor/autoload.php";
          $app = require "/var/www/html/bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          echo config("database.connections.pgsql.database");
          ')"
          HUB_APP_USER="$(docker exec -u sail "$HUB_APP_CONTAINER" php -r '
          require "/var/www/html/vendor/autoload.php";
          $app = require "/var/www/html/bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          echo config("database.connections.pgsql.username");
          ')"
          test "$HUB_APP_DATABASE" = "$HUB_PG_DATABASE"
          test "$HUB_APP_USER" = "$HUB_PG_USER"

          docker exec "$HUB_PG_CONTAINER" pg_isready -q -d "$HUB_PG_DATABASE" -U "$HUB_PG_USER"
          test "$(docker exec "$HUB_PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U "$HUB_PG_USER" -d "$HUB_PG_DATABASE" -Atqc 'select current_database()')" = "$HUB_PG_DATABASE"
          test "$(docker exec "$HUB_PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U "$HUB_PG_USER" -d "$HUB_PG_DATABASE" -Atqc 'select current_user')" = "$HUB_PG_USER"

          BACKUP_DIR=/var/lib/postgresql/data/mbfd-hub-pre-activation-backups
          BACKUP_FILE="$BACKUP_DIR/pre-activation-$RELEASE_SHA.dump"
          docker exec "$HUB_PG_CONTAINER" mkdir -p "$BACKUP_DIR"
          docker exec "$HUB_PG_CONTAINER" sh -c "umask 077 && pg_dump -U '$HUB_PG_USER' -Fc -f '$BACKUP_FILE' '$HUB_PG_DATABASE'"
          docker exec "$HUB_PG_CONTAINER" test -s "$BACKUP_FILE"
          docker exec "$HUB_PG_CONTAINER" pg_restore --list "$BACKUP_FILE" >/dev/null
          REMOTE

      - name: Checkout exact approved candidate
        run: |
          set -euo pipefail
          RELEASE_SHA="$GITHUB_SHA"
          test -n "$RELEASE_SHA"
          # This quoted heredoc is intentionally evaluated on the remote host.
          # shellcheck disable=SC2029
          ssh deploy-target "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/mbfd/mbfd-hub
          git fetch origin main --no-tags
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          REMOTE

      - name: Build and activate Hub application only
        run: |
          ssh deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          test "$(docker inspect --format '{{.Name}}' "$HUB_APP_CONTAINER")" = "/$HUB_APP_CONTAINER"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$HUB_APP_CONTAINER")" = "laravel.test"
          cd /opt/mbfd/mbfd-hub

          docker exec -u sail "$HUB_APP_CONTAINER" composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan migrate --force
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan optimize:clear
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan config:cache
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan route:cache
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan view:cache
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan filament:clear-cached-components
          docker exec -u sail "$HUB_APP_CONTAINER" bash -lc 'set -euo pipefail
            cd /var/www/html
            npm ci --legacy-peer-deps
            npm run build
            php artisan filament:assets
            cd resources/js/daily-checkout
            npm ci --legacy-peer-deps
            DAILY_CHECKOUT_OUT_DIR=../../../public/daily npm run build
          '
          docker compose -f compose.prod.yaml up -d --build --no-deps laravel.test
          REMOTE

      - name: Verify Hub application health
        run: |
          ssh deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          for _ in $(seq 1 60); do
            if docker inspect --format='{{.State.Health.Status}}' "$HUB_APP_CONTAINER" | grep -qx healthy \
              && docker exec "$HUB_APP_CONTAINER" curl -fsS http://localhost:80/up >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'MBFD Hub application did not become healthy after activation.' >&2
          exit 1
          REMOTE

      - name: Verify supervised Hub background services
        run: |
          ssh deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          test "$(docker inspect --format '{{.Name}}' "$HUB_APP_CONTAINER")" = "/$HUB_APP_CONTAINER"
          docker exec "$HUB_APP_CONTAINER" pgrep -af '^/usr/bin/php /var/www/html/artisan reverb:start '
          docker exec "$HUB_APP_CONTAINER" pgrep -af '^/usr/bin/php /var/www/html/artisan queue:work '
          REMOTE

      - name: Record successful Hub candidate activation
        run: |
          set -euo pipefail
          RELEASE_SHA="$GITHUB_SHA"
          test -n "$RELEASE_SHA"
          # This quoted heredoc is intentionally evaluated on the remote host.
          # shellcheck disable=SC2029
          ssh deploy-target "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/mbfd/mbfd-hub
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          printf '{"sha":"%s","deployed_at":"%s"}\n' "$RELEASE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/deploy-marker.json
          REMOTE
