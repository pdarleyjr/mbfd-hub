name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # CI checks run on GitHub-hosted runner (fast, no network dependency)
  # -------------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup PHP
        uses: shivammathur/setup-php@728c6c6b8cf02c2e48117716a91ee48313958a19 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv, fileinfo
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Syntax check
        run: find app config routes -name "*.php" -exec php -l {} \; | grep -v "No syntax errors" || true

  # -------------------------------------------------------------------
  # Deploy runs on self-hosted runner on the production host
  # -------------------------------------------------------------------
  deploy:
    needs: ci
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: https://www.mbfdhub.com

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Pre-deploy backup
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          PG_CONTAINER=$(docker ps --format '{{.Names}}' | grep -E 'pgsql' | head -1)
          if [ -z "$PG_CONTAINER" ]; then
            echo "::warning::No PostgreSQL container found, skipping backup"
          else
            docker exec "$PG_CONTAINER" pg_dump -U mbfd_user -Fc mbfd_hub > "/tmp/pre_deploy_${TIMESTAMP}.dump"
            echo "✓ Pre-deploy backup: /tmp/pre_deploy_${TIMESTAMP}.dump"
          fi

      - name: Prepare workspace for deploy
        run: |
          # Find .env from known locations on this host
          ENV_FOUND=false
          for ENV_PATH in /opt/mbfd-hub/.env /opt/mbfd/mbfd-hub/.env /home/*/mbfd-hub/.env /opt/mbfd-hub/app/.env; do
            if [ -f "$ENV_PATH" ]; then
              cp "$ENV_PATH" .env
              echo "✓ Copied .env from $ENV_PATH"
              ENV_FOUND=true
              break
            fi
          done
          # Also check if compose already has env_file or .env exists from prior run
          if [ "$ENV_FOUND" = false ]; then
            # Search more broadly
            FOUND=$(find /opt -name ".env" -path "*mbfd*" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" .env
              echo "✓ Copied .env from $FOUND"
              ENV_FOUND=true
            fi
          fi
          if [ "$ENV_FOUND" = false ]; then
            echo "::error::.env file not found anywhere. Searched /opt/mbfd-hub, /opt/mbfd/mbfd-hub, /home/*/mbfd-hub"
            echo "Debug: ls /opt/" && ls /opt/ 2>&1 || true
            echo "Debug: find .env" && find /opt -name ".env" -maxdepth 4 2>/dev/null || true
            exit 1
          fi
          # Write deploy marker
          echo "{\"sha\":\"$(git rev-parse HEAD)\",\"deployed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > public/deploy-marker.json
          echo "✓ Workspace ready ($(git rev-parse --short HEAD))"

      - name: Install composer deps (needed for Sail Dockerfile)
        run: |
          # Install composer if not available
          if ! command -v composer &> /dev/null; then
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/tmp
            COMPOSER="/tmp/composer.phar"
          else
            COMPOSER="composer"
          fi
          # Check if php is available; if not, skip (docker build will handle it)
          if command -v php &> /dev/null; then
            $COMPOSER install --prefer-dist --no-interaction --no-progress --no-scripts 2>/dev/null || echo "::warning::composer install failed, checking if Sail runtime exists"
          fi
          # Ensure the Sail Dockerfile directory exists
          if [ ! -f vendor/laravel/sail/runtimes/8.5/Dockerfile ]; then
            echo "::warning::Sail Dockerfile not found at vendor/laravel/sail/runtimes/8.5/Dockerfile"
            echo "Checking if image already exists..."
            if docker images sail-8.5/app --format '{{.ID}}' | head -1 | grep -q .; then
              echo "✓ Using existing sail-8.5/app image"
            else
              echo "::error::No Sail Dockerfile and no cached image available"
              exit 1
            fi
          fi

      - name: Rebuild containers
        run: |
          docker compose -f compose.prod.yaml up -d --build 2>/dev/null || docker compose -f compose.prod.yaml up -d
          echo "✓ Containers rebuilt"

      - name: Resolve container names
        id: containers
        run: |
          APP=$(docker ps --format '{{.Names}}' | grep -E 'laravel' | head -1)
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "✓ Laravel container: $APP"

      - name: Wait for health
        run: |
          APP="${{ steps.containers.outputs.app }}"
          for i in $(seq 1 60); do
            if docker exec "$APP" curl -sf http://localhost:80 > /dev/null 2>&1; then
              echo "✓ Laravel healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Laravel did not become healthy in 60s"
          exit 1

      - name: Verify background services
        run: |
          APP="${{ steps.containers.outputs.app }}"
          docker exec "$APP" bash -c \
            'pgrep -f "reverb:start" || nohup php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction > /tmp/reverb.log 2>&1 &'
          docker exec "$APP" bash -c \
            'pgrep -f "queue:work" || nohup php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 > /tmp/queue-worker.log 2>&1 &'
          echo "✓ Reverb and queue worker running"

      - name: Run migrations and optimize
        run: |
          APP="${{ steps.containers.outputs.app }}"
          docker exec "$APP" php artisan migrate --force
          docker exec "$APP" php artisan optimize:clear
          docker exec "$APP" php artisan config:cache
          docker exec "$APP" php artisan route:cache
          docker exec "$APP" php artisan view:cache || docker exec "$APP" php artisan view:clear
          docker exec "$APP" php artisan filament:clear-cached-components
          echo "✓ Laravel optimized"

      - name: Build frontend assets
        run: |
          APP="${{ steps.containers.outputs.app }}"
          docker exec "$APP" bash -c 'npm install --legacy-peer-deps && npm run build'
          docker exec "$APP" php artisan filament:assets
          docker exec "$APP" bash -c 'cd /var/www/html/resources/js/daily-checkout && npm install --legacy-peer-deps && npm run build'
          echo "✓ All frontend assets built"

      - name: Fix permissions
        run: |
          APP="${{ steps.containers.outputs.app }}"
          docker exec "$APP" chmod -R 775 storage bootstrap/cache

  # -------------------------------------------------------------------
  # Smoke tests run from GitHub-hosted runner (external perspective)
  # -------------------------------------------------------------------
  smoke-tests:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Run smoke tests
        run: |
          PASS=0; FAIL=0
          test_url() {
            local desc="$1" url="$2" expected="${3:-200}"
            HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$url" --max-time 15)
            if [ "$HTTP_CODE" = "$expected" ]; then
              echo "✓ $desc → HTTP $HTTP_CODE"; PASS=$((PASS + 1))
            else
              echo "✗ $desc → HTTP $HTTP_CODE (expected $expected)"; FAIL=$((FAIL + 1))
            fi
          }
          echo "=== Post-Deploy Smoke Tests ==="
          sleep 5
          test_url "Landing page"        "https://www.mbfdhub.com/"
          test_url "Daily Forms"          "https://www.mbfdhub.com/daily/"
          test_url "Admin login"          "https://www.mbfdhub.com/admin/login"
          test_url "Service worker"       "https://www.mbfdhub.com/sw.js"
          test_url "Daily SW"             "https://www.mbfdhub.com/daily/service-worker.js"
          test_url "Manifest"             "https://www.mbfdhub.com/manifest.json"
          test_url "Deploy marker"        "https://www.mbfdhub.com/deploy-marker.json"
          test_url "Baserow"              "https://baserow.mbfdhub.com"    "200"
          test_url "Snipe-IT"             "https://inventory.mbfdhub.com"  "200"
          echo ""
          echo "=== Results: $PASS passed, $FAIL failed ==="
          [ "$FAIL" -gt 0 ] && exit 1 || true
