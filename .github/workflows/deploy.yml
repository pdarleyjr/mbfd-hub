name: Deploy approved Hub candidate

# A merge to main runs CI only. Production activation requires a deliberate
# dispatch from main, an explicit confirmation, exact-SHA release gates, and
# protected production-environment approval.
on:
  workflow_dispatch:
    inputs:
      final_release_sha:
        description: 'Exact 40-character main SHA represented by the immutable image.'
        required: true
        type: string
      final_image_digest:
        description: 'Exact GHCR image digest in sha256:<64 lowercase hex> form.'
        required: true
        type: string
      confirm_production_activation:
        description: 'I confirm this approved main candidate may activate the MBFD Hub production runtime.'
        required: true
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  assert-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main and explicit activation confirmation
        env:
          FINAL_RELEASE_SHA: ${{ inputs.final_release_sha }}
          FINAL_IMAGE_DIGEST: ${{ inputs.final_image_digest }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirm_production_activation }}" = "true"
          test -n "$GITHUB_SHA"
          test "$FINAL_RELEASE_SHA" = "$GITHUB_SHA"
          [[ "$FINAL_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'final_image_digest must be a lowercase sha256 digest.' >&2
            exit 1
          }
  release-gates:
    needs: assert-main
    uses: ./.github/workflows/hub-release-gates.yml
    with:
      pint_base_sha: ${{ format('{0}^', github.sha) }}

  deploy:
    needs: release-gates
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: self-hosted
    timeout-minutes: 60
    environment:
      name: production
      url: https://www.mbfdhub.com
    steps:
      - name: Configure ephemeral Hub deployment SSH target
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.MBFD_HUB_SSH_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.MBFD_HUB_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          SSH_DIR="$RUNNER_TEMP/mbfd-hub-ssh"
          install -d -m 700 "$SSH_DIR"
          printf '%s\n' "$DEPLOY_KEY" > "$SSH_DIR/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          printf 'Host deploy-target\n  HostName %s\n  User %s\n  IdentityFile %s\n  UserKnownHostsFile %s\n  StrictHostKeyChecking yes\n  ConnectTimeout 10\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$SSH_DIR/deploy_key" "$SSH_DIR/known_hosts" > "$SSH_DIR/config"
          chmod 600 "$SSH_DIR/deploy_key" "$SSH_DIR/config"
          printf 'HUB_SSH_CONFIG=%s\n' "$SSH_DIR/config" >> "$GITHUB_ENV"

      - name: Inspect Hub production checkout and runtime
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          ssh -F "$HUB_SSH_CONFIG" deploy-target "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          HUB_CHECKOUT=/opt/mbfd/mbfd-hub
          HUB_APP_CONTAINER=mbfd-hub-laravel
          HUB_PG_CONTAINER=mbfd-hub-pgsql
          HUB_PG_DATABASE=mbfd_hub
          HUB_PG_USER=mbfd_user

          test -d "$HUB_CHECKOUT/.git"
          cd "$HUB_CHECKOUT"
          git status --short --branch
          git diff --stat
          if test -n "$(git status --porcelain)"; then
            echo 'Refusing to overwrite a dirty production checkout.' >&2
            exit 1
          fi

          test "$(docker inspect --format '{{.Name}}' "$HUB_APP_CONTAINER")" = "/$HUB_APP_CONTAINER"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$HUB_APP_CONTAINER")" = 'laravel.test'
          test "$(docker inspect --format '{{.Name}}' "$HUB_PG_CONTAINER")" = "/$HUB_PG_CONTAINER"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$HUB_PG_CONTAINER")" = 'pgsql'
          test "$(docker inspect --format '{{.State.Running}}' "$HUB_APP_CONTAINER")" = 'true'
          test "$(docker inspect --format '{{.State.Running}}' "$HUB_PG_CONTAINER")" = 'true'
          docker exec "$HUB_PG_CONTAINER" pg_isready -q -d "$HUB_PG_DATABASE" -U "$HUB_PG_USER"
          TRT_DUPLICATE_DATES="$(docker exec "$HUB_PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U "$HUB_PG_USER" -d "$HUB_PG_DATABASE" -Atqc \
            'SELECT session_date FROM trt_inventory_sessions WHERE trailer_id IS NULL GROUP BY session_date HAVING COUNT(*) > 1')"
          if test -n "$TRT_DUPLICATE_DATES"; then
            echo 'TRT default-session duplicates require deliberate data reconciliation before migration.' >&2
            printf '%s\n' "$TRT_DUPLICATE_DATES" >&2
            exit 1
          fi
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan migrate:status --no-ansi
          REMOTE

      - name: Checkout exact approved candidate
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          ssh -F "$HUB_SSH_CONFIG" deploy-target "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/mbfd/mbfd-hub
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          git cat-file -e "$RELEASE_SHA^{commit}"
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          REMOTE

      - name: Pull and verify immutable Hub image
        env:
          FINAL_RELEASE_SHA: ${{ inputs.final_release_sha }}
          FINAL_IMAGE_DIGEST: ${{ inputs.final_image_digest }}
        run: |
          set -euo pipefail
          ssh -F "$HUB_SSH_CONFIG" deploy-target "FINAL_RELEASE_SHA='$FINAL_RELEASE_SHA' FINAL_IMAGE_DIGEST='$FINAL_IMAGE_DIGEST' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/mbfd/mbfd-hub
          IMAGE_REPOSITORY="$(head -n 1 docker/production/image-repository)"
          test "$IMAGE_REPOSITORY" = 'ghcr.io/pdarleyjr/mbfd-hub'
          IMAGE_REF="$IMAGE_REPOSITORY@$FINAL_IMAGE_DIGEST"
          docker pull "$IMAGE_REF"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")" = "$FINAL_RELEASE_SHA"
          REMOTE

      - name: Verify targeted Hub database backup
        env:
          RELEASE_SHA: ${{ github.sha }}
          HUB_BACKUP_DIR: ${{ vars.MBFD_HUB_BACKUP_DIR }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          test -n "$HUB_BACKUP_DIR"
          ssh -F "$HUB_SSH_CONFIG" deploy-target "RELEASE_SHA='$RELEASE_SHA' HUB_BACKUP_DIR='$HUB_BACKUP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          HUB_CHECKOUT=/opt/mbfd/mbfd-hub
          HUB_PG_CONTAINER=mbfd-hub-pgsql
          HUB_PG_DATABASE=mbfd_hub
          HUB_PG_USER=mbfd_user

          test "$(docker inspect --format '{{.Name}}' "$HUB_PG_CONTAINER")" = "/$HUB_PG_CONTAINER"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$HUB_PG_CONTAINER")" = 'pgsql'
          case "$HUB_BACKUP_DIR" in
            /var/lib/postgresql/data|/var/lib/postgresql/data/*|'')
              echo 'Hub backup storage must be outside the PostgreSQL data volume.' >&2
              exit 1
              ;;
           esac
           PG_DATA_SOURCE="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Source}}{{end}}{{end}}' "$HUB_PG_CONTAINER")"
           test -n "$PG_DATA_SOURCE"
           BACKUP_PATH_HELPER_IMAGE=sail-8.5/app
           case "$PG_DATA_SOURCE" in
             /mnt/*) PG_DATA_SOURCE_IN_HELPER="/host-mnt/${PG_DATA_SOURCE#/mnt/}" ;;
             *)
               echo 'Hub PostgreSQL data source must be mounted below /mnt for isolated path validation.' >&2
               exit 1
               ;;
           esac
           case "$HUB_BACKUP_DIR" in
             /mnt/*) HUB_BACKUP_DIR_IN_HELPER="/host-mnt/${HUB_BACKUP_DIR#/mnt/}" ;;
             *)
               echo 'Hub backup storage must be mounted below /mnt for isolated path validation.' >&2
               exit 1
               ;;
           esac
           # Path resolution must traverse the protected PostgreSQL data directory;
           # retain only read/search bypass in the isolated read-only helper.
           docker run --rm --network none --pull=never --read-only --cap-drop=ALL --cap-add=DAC_READ_SEARCH --security-opt=no-new-privileges --user 0:0 --entrypoint sh \
             --mount type=bind,src=/mnt,dst=/host-mnt,readonly \
             "$BACKUP_PATH_HELPER_IMAGE" -euc '
               PG_DATA_SOURCE_REAL="$(realpath -e -- "$1")"
               HUB_BACKUP_DIR_REAL="$(realpath -e -- "$2")"
               case "$HUB_BACKUP_DIR_REAL" in
                 "$PG_DATA_SOURCE_REAL"|"$PG_DATA_SOURCE_REAL"/*)
                   echo "Hub backup storage resolves inside the PostgreSQL data source." >&2
                   exit 1
                   ;;
               esac
             ' sh "$PG_DATA_SOURCE_IN_HELPER" "$HUB_BACKUP_DIR_IN_HELPER"
           test -d "$HUB_BACKUP_DIR"
           test -w "$HUB_BACKUP_DIR"

           cd "$HUB_CHECKOUT"
           PREVIOUS_SHA="$(git rev-parse HEAD)"
           BACKUP_ID="mbfd-hub-pre-activation-$(date -u +%Y%m%dT%H%M%SZ)-$RELEASE_SHA"
           BACKUP_FILE="$HUB_BACKUP_DIR/$BACKUP_ID.dump"
          umask 077
          docker exec "$HUB_PG_CONTAINER" pg_dump -U "$HUB_PG_USER" -Fc "$HUB_PG_DATABASE" > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          docker exec -i "$HUB_PG_CONTAINER" pg_restore --list < "$BACKUP_FILE" > /dev/null
           BACKUP_SHA256="$(sha256sum "$BACKUP_FILE" | awk '{print $1}')"
           printf 'release_sha=%s\nprevious_sha=%s\ncreated_at=%s\nbackup_file=%s\nsha256=%s\n' \
             "$RELEASE_SHA" "$PREVIOUS_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$BACKUP_FILE" "$BACKUP_SHA256" > "$HUB_BACKUP_DIR/$BACKUP_ID.metadata"
          echo "Verified Hub backup: $BACKUP_FILE sha256=$BACKUP_SHA256"
          REMOTE

      - name: Enter maintenance mode and verify queue safety
        run: |
          set -euo pipefail
          ssh -F "$HUB_SSH_CONFIG" deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan down --render=errors::503
          MAINTENANCE_DRIVER="$(docker exec -u sail "$HUB_APP_CONTAINER" printenv APP_MAINTENANCE_DRIVER || true)"
          test -z "$MAINTENANCE_DRIVER" || test "$MAINTENANCE_DRIVER" = 'file'
          docker exec -u sail "$HUB_APP_CONTAINER" test -f /var/www/html/storage/framework/down
          QUEUE_PROCESSES="$(docker exec "$HUB_APP_CONTAINER" pgrep -af 'artisan queue:work' || true)"
          test -n "$QUEUE_PROCESSES"
          if printf '%s\n' "$QUEUE_PROCESSES" | grep -Eq -- '(^|[[:space:]])--force([[:space:]]|$)'; then
            echo 'Refusing activation while a queue worker bypasses maintenance mode.' >&2
            exit 1
          fi
          REMOTE

      - name: Migrate and activate prebuilt Hub image
        env:
          RELEASE_SHA: ${{ github.sha }}
          FINAL_IMAGE_DIGEST: ${{ inputs.final_image_digest }}
          HUB_IMAGE_RUNTIME_ENV: ${{ vars.MBFD_HUB_IMAGE_RUNTIME_ENV }}
          HUB_ACTIVATION_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          test -n "$FINAL_IMAGE_DIGEST"
          test -n "$HUB_IMAGE_RUNTIME_ENV"
          test -n "$HUB_ACTIVATION_RUN_ID"
          ssh -F "$HUB_SSH_CONFIG" deploy-target "RELEASE_SHA='$RELEASE_SHA' FINAL_IMAGE_DIGEST='$FINAL_IMAGE_DIGEST' HUB_IMAGE_RUNTIME_ENV='$HUB_IMAGE_RUNTIME_ENV' HUB_ACTIVATION_RUN_ID='$HUB_ACTIVATION_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          HUB_CHECKOUT=/opt/mbfd/mbfd-hub
          HUB_APP_CONTAINER=mbfd-hub-laravel
          HUB_MIGRATION_CONTAINER="mbfd-hub-migrate-$HUB_ACTIVATION_RUN_ID"

          case "$HUB_IMAGE_RUNTIME_ENV" in
            /*) ;;
            *) echo 'MBFD_HUB_IMAGE_RUNTIME_ENV must be an absolute host-managed file path.' >&2; exit 1 ;;
          esac
          test -f "$HUB_IMAGE_RUNTIME_ENV"
          cd "$HUB_CHECKOUT"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          IMAGE_REPOSITORY="$(head -n 1 docker/production/image-repository)"
          test "$IMAGE_REPOSITORY" = 'ghcr.io/pdarleyjr/mbfd-hub'
          IMAGE_REF="$IMAGE_REPOSITORY@$FINAL_IMAGE_DIGEST"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")" = "$RELEASE_SHA"

          HUB_IMAGE_REF="$IMAGE_REF" docker compose --env-file "$HUB_IMAGE_RUNTIME_ENV" -f compose.prod.image.yaml run --interactive=false --rm --no-deps --pull never --name "$HUB_MIGRATION_CONTAINER" -e RELEASE_SHA="$RELEASE_SHA" --entrypoint bash laravel.test -lc '
              set -euo pipefail
              php artisan migrate:status --no-ansi
              php artisan migrate --force
              php artisan daily-checkout:apply-approved-policy --confirm=APPLY_APPROVED_FRONTLINE_DAILY_POLICY --no-interaction
              php artisan daily-checkout:activate-ledger --release-sha="$RELEASE_SHA" --no-interaction
              php artisan daily-checkout:apply-approved-policy --verify --no-interaction
            '

          OLD_CONTAINER_ID="$(docker inspect --format '{{.Id}}' "$HUB_APP_CONTAINER")"
          test -n "$OLD_CONTAINER_ID"

          HUB_IMAGE_REF="$IMAGE_REF" docker compose --env-file "$HUB_IMAGE_RUNTIME_ENV" -f compose.prod.image.yaml up -d --pull never --no-build --no-deps --force-recreate laravel.test

          test "$(docker inspect --format '{{.Name}}' "$HUB_APP_CONTAINER")" = "/$HUB_APP_CONTAINER"
          test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$HUB_APP_CONTAINER")" = 'laravel.test'
          NEW_CONTAINER_ID="$(docker inspect --format '{{.Id}}' "$HUB_APP_CONTAINER")"
          test -n "$NEW_CONTAINER_ID"
          test "$NEW_CONTAINER_ID" != "$OLD_CONTAINER_ID"
          test "$(docker inspect --format '{{.State.Running}}' "$HUB_APP_CONTAINER")" = 'true'
          RUNNING_IMAGE_REF="$(docker inspect --format '{{.Config.Image}}' "$HUB_APP_CONTAINER")"
          case "$RUNNING_IMAGE_REF" in
            *@sha256:*) ;;
            *) echo 'Recreated Hub container is not pinned to an immutable image digest.' >&2; exit 1 ;;
          esac
          RUNNING_IMAGE_DIGEST="${RUNNING_IMAGE_REF##*@}"
          test "$RUNNING_IMAGE_DIGEST" = "$FINAL_IMAGE_DIGEST"
          APPROVED_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          RUNNING_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$HUB_APP_CONTAINER")"
          test "$RUNNING_IMAGE_ID" = "$APPROVED_IMAGE_ID"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$RUNNING_IMAGE_ID" | grep -Fx "$IMAGE_REF"
          RUNNING_OCI_REVISION="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$RUNNING_IMAGE_ID")"
          test "$RUNNING_OCI_REVISION" = "$RELEASE_SHA"
          RUNNING_GIT_SHA="$(docker exec -u sail "$HUB_APP_CONTAINER" cat /var/www/html/.git-sha)"
          test "$RUNNING_GIT_SHA" = "$RELEASE_SHA"
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan optimize:clear
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan config:cache
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan route:cache
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan view:cache
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan filament:clear-cached-components
          REMOTE

      - name: Verify Hub application health
        run: |
          set -euo pipefail
          ssh -F "$HUB_SSH_CONFIG" deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          for _ in $(seq 1 60); do
            if docker inspect --format='{{.State.Health.Status}}' "$HUB_APP_CONTAINER" | grep -qx healthy \
              && docker exec "$HUB_APP_CONTAINER" curl -fsS http://localhost:8081/up > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'MBFD Hub application did not become healthy after activation.' >&2
          exit 1
          REMOTE

      - name: Restart Hub queues and verify background services
        run: |
          set -euo pipefail
          ssh -F "$HUB_SSH_CONFIG" deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          CACHE_DRIVER="$(docker exec -u sail "$HUB_APP_CONTAINER" php -r '
          require "/var/www/html/vendor/autoload.php";
          $app = require "/var/www/html/bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          echo config("cache.default");
          ')"
          case "$CACHE_DRIVER" in
            ''|array)
              echo 'Queue restart requires a shared, healthy cache driver.' >&2
              exit 1
              ;;
          esac
          docker exec -u sail "$HUB_APP_CONTAINER" php -r '
          require "/var/www/html/vendor/autoload.php";
          $app = require "/var/www/html/bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $cache = $app->make("cache");
          $key = "mbfd_release_queue_restart_probe";
          $cache->put($key, "ok", 60);
          if ($cache->get($key) !== "ok") { exit(1); }
          $cache->forget($key);
          '
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan queue:restart
          docker exec "$HUB_APP_CONTAINER" supervisorctl -c /etc/supervisor/conf.d/supervisord.conf restart 'queue-worker:*'
          for _ in $(seq 1 60); do
            SUPERVISOR_STATUS="$(docker exec "$HUB_APP_CONTAINER" supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status)"
            if printf '%s\n' "$SUPERVISOR_STATUS" | grep -Eq '^queue-worker:queue-worker_00 +RUNNING '; then
              break
            fi
            sleep 1
          done
          printf '%s\n' "$SUPERVISOR_STATUS"
          printf '%s\n' "$SUPERVISOR_STATUS" | grep -Eq '^php +RUNNING '
          printf '%s\n' "$SUPERVISOR_STATUS" | grep -Eq '^queue-worker:queue-worker_00 +RUNNING '
          printf '%s\n' "$SUPERVISOR_STATUS" | grep -Eq '^reverb +RUNNING '
          REMOTE

      - name: Leave maintenance mode and verify internal health
        run: |
          set -euo pipefail
          ssh -F "$HUB_SSH_CONFIG" deploy-target 'bash -s' <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          docker exec -u sail "$HUB_APP_CONTAINER" php artisan up
          test "$(docker exec "$HUB_APP_CONTAINER" curl -sS -o /dev/null -w '%{http_code}' http://localhost:8081/up)" = '200'
          REMOTE

      - name: Record successful Hub candidate activation
        env:
          RELEASE_SHA: ${{ github.sha }}
          FINAL_IMAGE_DIGEST: ${{ inputs.final_image_digest }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          test -n "$FINAL_IMAGE_DIGEST"
          ssh -F "$HUB_SSH_CONFIG" deploy-target "RELEASE_SHA='$RELEASE_SHA' FINAL_IMAGE_DIGEST='$FINAL_IMAGE_DIGEST' bash -s" <<'REMOTE'
          set -euo pipefail
          HUB_APP_CONTAINER=mbfd-hub-laravel
          test "$(docker inspect --format '{{.State.Running}}' "$HUB_APP_CONTAINER")" = 'true'
          RUNNING_CONTAINER_ID="$(docker inspect --format '{{.Id}}' "$HUB_APP_CONTAINER")"
          test -n "$RUNNING_CONTAINER_ID"
          RUNNING_IMAGE_REF="$(docker inspect --format '{{.Config.Image}}' "$HUB_APP_CONTAINER")"
          case "$RUNNING_IMAGE_REF" in
            *@sha256:*) ;;
            *) echo 'Running Hub container is not pinned to an immutable image digest.' >&2; exit 1 ;;
          esac
          RUNNING_IMAGE_DIGEST="${RUNNING_IMAGE_REF##*@}"
          test "$RUNNING_IMAGE_DIGEST" = "$FINAL_IMAGE_DIGEST"
          RUNNING_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$HUB_APP_CONTAINER")"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$RUNNING_IMAGE_ID" | grep -F '@' | grep -Fx "$RUNNING_IMAGE_REF"
          RUNNING_OCI_REVISION="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$RUNNING_IMAGE_ID")"
          test "$RUNNING_OCI_REVISION" = "$RELEASE_SHA"
          RUNNING_GIT_SHA="$(docker exec -u sail "$HUB_APP_CONTAINER" cat /var/www/html/.git-sha)"
          test "$RUNNING_GIT_SHA" = "$RELEASE_SHA"
          DEPLOY_MARKER="$(printf '{"sha":"%s","image_digest":"%s","image_id":"%s","oci_revision":"%s","embedded_git_sha":"%s","container_id":"%s","deployed_at":"%s"}' "$RUNNING_GIT_SHA" "$RUNNING_IMAGE_DIGEST" "$RUNNING_IMAGE_ID" "$RUNNING_OCI_REVISION" "$RUNNING_GIT_SHA" "$RUNNING_CONTAINER_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
          docker exec -u sail "$HUB_APP_CONTAINER" sh -c "printf '%s\n' '$DEPLOY_MARKER' > /var/www/html/public/deploy-marker.json"
          printf '%s\n' "$DEPLOY_MARKER" > /opt/mbfd/mbfd-hub/public/deploy-marker.json
          REMOTE

      - name: Verify public Hub smoke routes
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 15 https://www.mbfdhub.com/up > /dev/null
          test "$(curl --silent --show-error --location --max-time 15 --output /dev/null --write-out '%{http_code}' https://www.mbfdhub.com/)" = '200'
          test "$(curl --silent --show-error --max-time 15 --header 'Cookie:' --output /dev/null --write-out '%{http_code}' https://www.mbfdhub.com/daily/stations/6)" = '302'
          test "$(curl --silent --show-error --max-time 15 --header 'Cookie:' --output /dev/null --write-out '%{http_code}' https://www.mbfdhub.com/api/public/stations)" = '302'
          MARKER_SHA="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 15 https://www.mbfdhub.com/deploy-marker.json | jq -er '.sha')"
          test "$MARKER_SHA" = "$RELEASE_SHA"
