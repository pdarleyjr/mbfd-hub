name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv, fileinfo
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Syntax check
        run: find app config routes -name "*.php" -exec php -l {} \; | grep -v "No syntax errors" || true

  deploy:
    needs: ci
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: https://www.mbfdhub.com

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null || true
          # Overwrite (not append) SSH config to avoid stale deploy-target entries
          cat > ~/.ssh/config << EOF
          Host deploy-target
            HostName 127.0.0.1
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ConnectTimeout 10
            ServerAliveInterval 10
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Pre-deploy backup
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          ssh deploy-target "
            PG=\$(docker ps --format '{{.Names}}' | grep pgsql | head -1)
            if [ -n \"\$PG\" ]; then
              docker exec \"\$PG\" pg_dump -U mbfd_user -Fc mbfd_hub > /tmp/pre_deploy_${TIMESTAMP}.dump
              echo '✓ Pre-deploy backup: /tmp/pre_deploy_${TIMESTAMP}.dump'
            else
              echo '::warning::No PostgreSQL container found'
            fi
          "

      # set -e ensures failures inside the SSH heredoc bubble up — previously a
      # silent git-reset permission error left the host on a stale commit while
      # the workflow still reported success. HEAD verification below catches
      # that case explicitly. The chown step runs inside the Laravel container
      # as root via Docker group membership (no host sudo needed); it covers
      # public/ (where vite emits root-owned files) plus app/Filament/Resources
      # (where prior agents have created root-owned untracked files that block
      # git clean -fd).
      - name: Pull latest code
        run: |
          ssh deploy-target "set -e
            cd /opt/mbfd/mbfd-hub
            docker exec -u 0 mbfd-hub-laravel chown -R sail:sail /var/www/html/public/build /var/www/html/public/daily /var/www/html/app/Filament 2>/dev/null || true
            git fetch origin --force --prune
            git reset --hard origin/main
            git clean -fd
            EXPECTED=\$(git rev-parse origin/main)
            ACTUAL=\$(git rev-parse HEAD)
            if [ \"\$EXPECTED\" != \"\$ACTUAL\" ]; then
              echo '::error::HEAD does not match origin/main after reset' >&2
              exit 1
            fi
            echo '{\"sha\":\"'\$ACTUAL'\",\"deployed_at\":\"'\$(date -u +%Y-%m-%dT%H:%M:%SZ)'\"}' > public/deploy-marker.json
            echo '✓ Code updated to '\$(git rev-parse --short HEAD)
          "

      - name: Rebuild containers
        run: |
          ssh deploy-target "
            cd /opt/mbfd/mbfd-hub
            docker compose -f compose.prod.yaml up -d --build
            echo '✓ Containers rebuilt'
          "

      - name: Restart Laravel container
        run: |
          ssh deploy-target "docker restart mbfd-hub-laravel && echo '✓ Container restarted'"

      - name: Wait for container ready
        run: |
          sleep 10
          for i in $(seq 1 30); do
            if ssh deploy-target "docker exec mbfd-hub-laravel php -r 'echo 1;'" 2>/dev/null; then
              echo "✓ Container accepting commands after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Container not ready after 30s"
          exit 1

      - name: Fix permissions
        run: |
          ssh deploy-target "docker exec mbfd-hub-laravel chmod -R 775 storage bootstrap/cache"

      # Composer install runs INSIDE the container as the sail user so vendor/
      # ownership matches the host runner — same pattern as Build frontend
      # assets step below. The --no-dev flag keeps phpunit/mockery out of
      # production. Lockfile drift would fail the whole deploy here rather
      # than at runtime when an autoloaded class can't be found.
      - name: Install PHP dependencies
        run: |
          ssh deploy-target "set -e
            docker exec -u sail mbfd-hub-laravel composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
            echo '✓ Composer dependencies installed'
          "

      - name: Run migrations and optimize
        run: |
          ssh deploy-target "
            docker exec mbfd-hub-laravel php artisan storage:link --force 2>/dev/null || true
            docker exec mbfd-hub-laravel php artisan migrate --force
            docker exec mbfd-hub-laravel php artisan optimize:clear
            docker exec mbfd-hub-laravel php artisan config:cache
            docker exec mbfd-hub-laravel php artisan route:cache
            docker exec mbfd-hub-laravel php artisan view:cache || docker exec mbfd-hub-laravel php artisan view:clear
            docker exec mbfd-hub-laravel php artisan filament:clear-cached-components
            echo '✓ Laravel optimized'
          "

      # docker exec runs as 'sail' (UID 1000) so build output is owned by the
      # same user as the host runner — without this, files end up root-owned
      # and the next deploy's git reset fails to replace them.
      - name: Build frontend assets
        run: |
          ssh deploy-target "set -e
            docker exec -u sail mbfd-hub-laravel bash -c 'npm install --legacy-peer-deps && npm run build'
            docker exec mbfd-hub-laravel php artisan filament:assets
            docker exec -u sail mbfd-hub-laravel bash -c 'cd /var/www/html/resources/js/daily-checkout && npm install --legacy-peer-deps && npm run build'
            echo '✓ All frontend assets built'
          "

      - name: Verify background services
        run: |
          ssh deploy-target "
            docker exec mbfd-hub-laravel bash -c 'pgrep -f \"reverb:start\" || nohup php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction > /tmp/reverb.log 2>&1 &'
            docker exec mbfd-hub-laravel bash -c 'pgrep -f \"queue:work\" || nohup php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 > /tmp/queue-worker.log 2>&1 &'
            echo '✓ Reverb and queue worker running'
          "

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if ssh deploy-target "docker exec mbfd-hub-laravel curl -sf http://localhost:80" > /dev/null 2>&1; then
              echo "✓ Laravel healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Laravel did not become healthy in 60s"
          exit 1

  smoke-tests:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Run smoke tests
        run: |
          PASS=0; FAIL=0
          test_url() {
            local desc="$1" url="$2" expected="${3:-200}"
            HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$url" --max-time 15)
            if [ "$HTTP_CODE" = "$expected" ]; then
              echo "✓ $desc → HTTP $HTTP_CODE"; PASS=$((PASS + 1))
            else
              echo "✗ $desc → HTTP $HTTP_CODE (expected $expected)"; FAIL=$((FAIL + 1))
            fi
          }
          echo "=== Post-Deploy Smoke Tests ==="
          sleep 5
          test_url "Landing page"        "https://www.mbfdhub.com/"
          test_url "Daily Forms"          "https://www.mbfdhub.com/daily/"
          test_url "Admin login"          "https://www.mbfdhub.com/admin/login"
          test_url "Service worker"       "https://www.mbfdhub.com/sw.js"
          test_url "Daily SW"             "https://www.mbfdhub.com/daily/service-worker.js"
          test_url "Manifest"             "https://www.mbfdhub.com/manifest.json"
          test_url "Admin PWA manifest"   "https://www.mbfdhub.com/admin-pwa/manifest.webmanifest"
          test_url "Admin PWA SW"         "https://www.mbfdhub.com/admin-pwa/service-worker.js"
          test_url "Admin /up health"     "https://www.mbfdhub.com/up"
          test_url "Deploy marker"        "https://www.mbfdhub.com/deploy-marker.json"
          test_url "Baserow"              "https://baserow.mbfdhub.com"    "200"
          test_url "Snipe-IT"             "https://inventory.mbfdhub.com"  "200"
          echo ""
          echo "=== Results: $PASS passed, $FAIL failed ==="
          [ "$FAIL" -gt 0 ] && exit 1 || true
