name: Inspect existing token for private CI capability

on:
  workflow_dispatch:
    inputs:
      expected_probe_sha:
        description: Exact independently reviewed diagnostic commit SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: policy-library-token-capability-probe
  cancel-in-progress: false

jobs:
  inspect-private-ci-capability:
    if: >-
      github.repository == 'pdarleyjr/mbfd-hub' &&
      github.repository_owner == 'pdarleyjr' &&
      github.actor == 'pdarleyjr' &&
      github.ref == 'refs/heads/codex/policy-library-token-capability-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect token metadata and dispatch fixed private CI
        env:
          PROBE_TOKEN: ${{ secrets.GH_PAT }}
          EXPECTED_PROBE_SHA: ${{ inputs.expected_probe_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.error, urllib.request

          REPOSITORY = 'pdarleyjr/mbfd-policy-library'
          WORKFLOW_PATH = '.github/workflows/ci.yml'
          WORKFLOW_ID = 372623806
          SOURCE_SHA = 'bb0d779756d19a551f73a2b96d3017ef4d45a4d1'
          BRANCH = 'refs/heads/codex/policy-library-token-capability-probe'
          ENDPOINT = 'https://api.github.com/repos/' + REPOSITORY + '/actions/'
          ALLOWED_SCOPES = {
              'repo', 'repo:status', 'repo_deployment', 'public_repo', 'repo:invite', 'security_events', 'workflow',
              'read:packages', 'write:packages', 'delete:packages', 'read:org', 'write:org', 'admin:org',
              'read:repo_hook', 'write:repo_hook', 'admin:repo_hook', 'user', 'read:user', 'user:email', 'user:follow',
              'gist', 'notifications', 'delete_repo', 'read:public_key', 'write:public_key', 'admin:public_key',
              'read:gpg_key', 'write:gpg_key', 'admin:gpg_key', 'read:ssh_signing_key', 'write:ssh_signing_key',
              'admin:ssh_signing_key', 'read:project', 'project', 'codespace', 'manage_runners:org', 'audit_log'}
          phase = 'guard'

          class ProbeFailure(Exception):
              def __init__(self, code, status=None):
                  self.code, self.status = code, status

          def require(condition, code):
              if not condition:
                  raise ProbeFailure(code)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          def request(path, payload=None):
              require(path in ('workflows/ci.yml', 'workflows/ci.yml/runs?branch=main&event=push&per_page=1',
                               'workflows/ci.yml/dispatches') or re.fullmatch(r'runs/[1-9][0-9]{0,19}', path), 'unexpected_endpoint')
              require(payload is None or (path == 'workflows/ci.yml/dispatches' and payload == {'ref': 'main'}), 'unexpected_payload')
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                         'X-GitHub-Api-Version': '2026-03-10', 'User-Agent': 'mbfd-owned-private-ci-capability-probe'}
              data = json.dumps(payload).encode() if payload is not None else None
              query = urllib.request.Request(ENDPOINT + path, headers=headers, data=data)
              try:
                  response = urllib.request.build_opener(NoRedirect()).open(query, timeout=15)
              except urllib.error.HTTPError as error:
                  status = error.code
                  error.close()
                  raise ProbeFailure('redirect_denied' if 300 <= status < 400 else 'http_rejected', status)
              with response:
                  if response.status != 200:
                      raise ProbeFailure('unexpected_http_status', response.status)
                  body = response.read(65537)
                  require(len(body) <= 65536, 'response_exceeds_bound')
                  scopes = response.headers.get('X-OAuth-Scopes')
                  return json.loads(body), scopes

          def emit(marker, record):
              encoded = json.dumps(record, sort_keys=True, separators=(',', ':'))
              require(len(encoded.encode()) <= 2048, 'record_exceeds_bound')
              print(marker + encoded, flush=True)

          try:
              require(os.environ.get('GITHUB_REPOSITORY') == 'pdarleyjr/mbfd-hub'
                      and os.environ.get('GITHUB_REPOSITORY_OWNER') == 'pdarleyjr'
                      and os.environ.get('GITHUB_ACTOR') == 'pdarleyjr'
                      and os.environ.get('GITHUB_REF') == BRANCH
                      and os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch', 'wrong_diagnostic_identity')
              expected = os.environ.get('EXPECTED_PROBE_SHA', '')
              require(re.fullmatch(r'[a-f0-9]{40}', expected) and expected == os.environ.get('GITHUB_SHA'), 'wrong_diagnostic_source')
              token = os.environ.pop('PROBE_TOKEN', '')
              require(bool(token), 'existing_secret_unavailable')
              kind = ('fine_grained_personal_access_token' if token.startswith('github_pat_') else
                      'classic_personal_access_token' if token.startswith('ghp_') else
                      'installation_token' if token.startswith('ghs_') else
                      'oauth_user_token' if token.startswith(('gho_', 'ghu_')) else 'unrecognized_token_kind')
              phase = 'workflow_read'
              workflow, scopes = request('workflows/ci.yml')
              require(workflow.get('id') == WORKFLOW_ID and workflow.get('path') == WORKFLOW_PATH
                      and workflow.get('state') == 'active'
                      and workflow.get('url') == ENDPOINT + 'workflows/' + str(WORKFLOW_ID), 'wrong_workflow_identity')
              listed = [scope.strip() for scope in (scopes or '').split(',') if scope.strip()]
              emit('MBFD_GH_PAT_CAPABILITY_READ_V1=', {
                  'token_kind': kind, 'oauth_scope_header': 'absent' if scopes is None else 'present',
                  'oauth_scopes': None if scopes is None else sorted(set(listed) & ALLOWED_SCOPES),
                  'unrecognized_scope_present': None if scopes is None else bool(set(listed) - ALLOWED_SCOPES),
                  'workflow_repository': REPOSITORY, 'workflow_id': str(WORKFLOW_ID),
                  'workflow_path': WORKFLOW_PATH, 'workflow_read': 'PASS'})
              phase = 'exact_private_ci_source'
              history, _ = request('workflows/ci.yml/runs?branch=main&event=push&per_page=1')
              runs = history.get('workflow_runs', [])
              require(len(runs) == 1 and runs[0].get('head_sha') == SOURCE_SHA and runs[0].get('head_branch') == 'main'
                      and runs[0].get('path') == WORKFLOW_PATH and runs[0].get('workflow_id') == WORKFLOW_ID
                      and runs[0].get('event') == 'push' and runs[0].get('status') == 'completed'
                      and runs[0].get('conclusion') == 'success', 'private_ci_source_not_qualified')
              phase = 'workflow_dispatch'
              dispatched, _ = request('workflows/ci.yml/dispatches', {'ref': 'main'})
              run_id = dispatched.get('workflow_run_id')
              require(type(run_id) is int and re.fullmatch(r'[1-9][0-9]{0,19}', str(run_id)), 'missing_exact_dispatched_run_id')
              require(dispatched.get('run_url') == ENDPOINT + 'runs/' + str(run_id), 'wrong_dispatched_run_url')
              phase = 'dispatched_run_identity'
              for attempt in range(6):
                  try:
                      metadata, _ = request('runs/' + str(run_id))
                      break
                  except ProbeFailure as error:
                      if error.status != 404 or attempt == 5:
                          raise
                      time.sleep(2)
              require(metadata.get('id') == run_id and metadata.get('head_sha') == SOURCE_SHA
                      and metadata.get('head_branch') == 'main' and metadata.get('path') == WORKFLOW_PATH
                      and metadata.get('workflow_id') == WORKFLOW_ID and metadata.get('event') == 'workflow_dispatch'
                      and metadata.get('run_attempt') == 1
                      and metadata.get('repository', {}).get('full_name') == REPOSITORY
                      and metadata.get('repository', {}).get('private') is True, 'wrong_dispatched_ci_identity')
              emit('MBFD_GH_PAT_CAPABILITY_WRITE_V1=', {
                  'workflow_run_id': str(run_id), 'workflow_repository': REPOSITORY, 'workflow_path': WORKFLOW_PATH,
                  'head_sha': SOURCE_SHA, 'run_attempt': '1', 'workflow_dispatch': 'PASS', 'production_activation': False})
          except BaseException as error:
              code = error.code if isinstance(error, ProbeFailure) else 'unclassified_probe_failure'
              status = error.status if isinstance(error, ProbeFailure) else None
              print(json.dumps({'phase': phase, 'failure': code, 'http_status': status}, separators=(',', ':')), flush=True)
              sys.exit(1)
          PY
