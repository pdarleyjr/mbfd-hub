name: Generated Assets Guard

# The tracked-asset check and the generated-asset manifest check already run in
# the required "Generated deployment assets" job in hub-release-gates.yml (the
# same guard script, after the same install and build). This workflow is kept
# only for the Conference bundle budget (npm run test:video-conferencing-bundle),
# which the release gates do not run yet. It therefore builds on pull requests
# that can change the Vite output, and always on pushes to main as a safety net.
# Fold the budget step into the gate job and delete this workflow to remove the
# second full build.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "resources/**"
      - "public/**"
      - "modules/policy-library/**"
      - "scripts/ci/**"
      - "package.json"
      - "package-lock.json"
      - "composer.json"
      - "composer.lock"
      - "vite.config.*"
      - "tsconfig*.json"
      - "postcss.config.*"
      - "tailwind.config.*"
      - ".github/workflows/generated-assets-guard.yml"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-guard:
    name: Build produces valid manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts --optimize-autoloader
      - name: Install Node dependencies
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm --prefix modules/policy-library ci --ignore-scripts
      - name: Build Vite and Filament assets
        run: |
          npm run build
          php artisan filament:assets
      - name: Build Daily PWA assets
        working-directory: resources/js/daily-checkout
        env:
          DAILY_CHECKOUT_OUT_DIR: ../../../public/daily
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm run build
      - name: Verify deployment assets after build
        env:
          REQUIRE_GENERATED_ASSETS: '1'
        run: |
          npm run test:video-conferencing-bundle
          node scripts/ci/guard-generated-assets.mjs
