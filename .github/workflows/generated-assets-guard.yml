name: Generated Assets Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/untrack-generated-hub-assets]

permissions:
  contents: read

jobs:
  tracked-guard:
    name: No generated assets tracked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify generated assets are not tracked
        run: bash scripts/ci/guard-generated-assets.sh

  build-guard:
    name: Build produces valid manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Build frontend assets
        run: npm run build
      - name: Verify manifest after build
        run: bash scripts/ci/guard-generated-assets.sh
