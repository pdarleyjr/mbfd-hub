name: CI

# This is validation only. It is deliberately unable to reach a self-hosted
# runner, deployment secret, production environment, or SSH target.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded pull-request runs are cancelled. Pushes to main get a unique group
# per run so main validation is never cancelled or left pending.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  release-gates:
    uses: ./.github/workflows/hub-release-gates.yml
    with:
      pint_base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
