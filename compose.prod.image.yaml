# Dedicated Laravel-service switch for immutable production images. It never
# declares PostgreSQL or Redis, so `up --no-deps laravel.test` cannot recreate
# shared dependencies. The existing production network must already contain
# their `pgsql` and `redis` aliases.
services:
  laravel.test:
    image: "${HUB_IMAGE_REF:?HUB_IMAGE_REF must be an immutable image digest}"
    container_name: mbfd-hub-laravel
    restart: unless-stopped
    stop_grace_period: 1860s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8081"
      - "127.0.0.1:8090:8080"
    environment:
      WWWUSER: "${HUB_WWWUSER:?HUB_WWWUSER must match the mounted storage owner}"
      WWWGROUP: "${HUB_WWWGROUP:?HUB_WWWGROUP must match the mounted storage group}"
      LARAVEL_SAIL: 1
      # Web tier: nginx + php-fpm (docker/production/php-fpm.conf). Pool size is
      # tunable here without a rebuild.
      PHP_FPM_MAX_CHILDREN: "${HUB_PHP_FPM_MAX_CHILDREN:-32}"
      # Read only by images built before the php-fpm runtime (artisan serve with
      # LARAVEL_SAIL=1). Kept so a manual rollback to such an image still runs
      # 8 workers instead of one; the php-fpm image ignores it.
      PHP_CLI_SERVER_WORKERS: "${HUB_PHP_CLI_SERVER_WORKERS:-8}"
      XDEBUG_MODE: "off"
    volumes:
      - "${HUB_APP_ENV_FILE:?HUB_APP_ENV_FILE must point to the host-managed Laravel environment file}:/var/www/html/.env:ro"
      - "${HUB_STORAGE_PATH:?HUB_STORAGE_PATH must be the existing writable Hub storage directory}:/var/www/html/storage"
      # Uploaded and generated files (storage/app: private + public disks) may
      # live on the large array while framework cache, sessions and logs stay on
      # HUB_STORAGE_PATH. Unset, it is HUB_STORAGE_PATH/app itself (no change).
      # A missing source fails the start instead of silently creating an empty,
      # root-owned directory (e.g. when the array is not mounted).
      # Runbook: docs/ops/storage-on-mbfd-storage.md
      - type: bind
        source: "${HUB_STORAGE_APP_PATH:-${HUB_STORAGE_PATH}/app}"
        target: /var/www/html/storage/app
        bind:
          create_host_path: false
      - "${HUB_GOOGLE_SA_PATH:-/dev/null}:/run/secrets/google_service_account.json:ro"
    networks:
      - mbfd-net
      - policy-scanner
      - cmd-feed
    security_opt:
      - no-new-privileges:true
    # nginx writes one JSON access-log line per request to stdout next to the
    # queue/scheduler output; keep more than the daemon's 5 x 10 MB default.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  mbfd-net:
    external: true
    name: "${HUB_NETWORK_NAME:?HUB_NETWORK_NAME must name the existing Hub Docker network}"
  policy-scanner:
    external: true
    name: "${POLICY_LIBRARY_SCANNER_NETWORK:-mbfd-workspace-internal}"
  # Unit Status: private path to the Command feed (http://cmd-api:8200). An internal network whose only other
  # member is Command's `cmd` container; created once on the host (mbfd-command docs/RELEASE.md section 13).
  cmd-feed:
    external: true
    name: "${UNIT_STATUS_FEED_NETWORK:-mbfd-cmd-feed}"
