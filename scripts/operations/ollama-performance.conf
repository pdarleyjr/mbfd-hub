[Service]
# Measured 2026-07-26 on the GMKtec EVO-X2 with qwen3.6:35b:
# - cold request: 100.61 s (100.29 s model load)
# - warm request: 0.413 s
# - loaded GPU/UMA allocation: 26.34 GB
#
# Keep one large model resident and serialize inference so two large contexts
# cannot compete for the 64 GiB GPU carve-out. Queueing remains bounded.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_QUEUE=8"
Environment="OLLAMA_KEEP_ALIVE=5m"
